/* ============================================================
   TOKENS — nenhum valor literal de cor, espaço ou tamanho pode
   existir fora daqui. É o que o teste test_design_tokens.py cobra,
   e é o que faz o modo escuro funcionar sem uma segunda folha.
   Ver app/docs/design-system.md.
   ============================================================ */
:root{
  /* escala fechada — Trecho 4, Parada 4. Poucos valores é o que faz uma escala
     servir pra alguma coisa: antes eram 42 paddings e 18 tamanhos de letra. */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  --r-1:4px; --r-2:8px; --r-pill:999px;
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:17px; --fs-lg:20px; --fs-num:28px;

  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E7ECF1; --border:rgba(16,24,40,0.13);
  --text:#101828; --text-2:#5A6478; --accent:#1F6F6B; --accent-bg:#D8EAE8;
  --on-accent:#FFFFFF;
  --danger:#8C2F3A; --danger-bg:#F5DEE1; --success:#2F6B45; --success-bg:#DDEDE3;
  --warn:#7A5A1F; --warn-bg:#F2E8D2; --stub:#9AA4B2;
  --shadow:0 1px 2px rgba(16,24,40,0.06), 0 8px 24px -12px rgba(16,24,40,0.20);
  --estagio-1:#A3B0B2; --estagio-2:#7FA6A2; --estagio-3:#4C8F89; --estagio-4:#1F6F6B;
  --tipo-orquestra:#1F6F6B;
  --tipo-backlog:#3F6B2A;
  --tipo-log:#9C3B33;
  --tipo-changelog:#8A6220;
  --tipo-readme:#5D4E9C;
  --tipo-skill:#0F7A72;
  --tipo-glossary:#7A6A2E;
  --tipo-doctrine:#7A2F8F;
  --tipo-linkmap:#2F5F8F;
  --tipo-script:#4A5A66;
  --tipo-trilha:#A8632A;
  --tipo-dashboard-html:#A85327;
  --tipo-other-markdown:#7C8794;
  --tipo-other-pertinent:#7C8794;
  --tipo-outro:#7C8794;
}

/* tema "areia" — dourado sobre areia, um tema entre outros (Trecho 4,
   Parada 1). A paleta de tipo de arquivo é compartilhada: ela diz o que o
   arquivo é, não de quem é a plataforma. */
:root[data-tema="areia"]{
  --bg:#F2ECDE; --surface:#FBF8F0; --surface-2:#EFE7D2; --border:rgba(27,22,15,0.14);
  --text:#1B160F; --text-2:#6E6555; --accent:#9C7A3C; --accent-bg:#F0E6CC;
  --on-accent:#FBF8F0;
  --danger:#7A2F2F; --danger-bg:#F0DFE1; --success:#4C6B2F; --success-bg:#E7EDD9;
  --warn:#7A5E2C; --warn-bg:#EFE7D2; --stub:#A8A69C;
  --shadow:0 1px 2px rgba(27,22,15,0.06), 0 8px 24px -12px rgba(27,22,15,0.18);
  --estagio-1:#B0A896; --estagio-2:#C0A87A; --estagio-3:#B08F4B; --estagio-4:#9C7A3C;
}
@media (prefers-color-scheme: dark){
  :root[data-tema="areia"]:not([data-theme="light"]){
  --bg:#16130E; --surface:#1E1A13; --surface-2:#2A2418; --border:rgba(242,236,222,0.14);
  --text:#F2ECDE; --text-2:#B2A98F; --accent:#CBA25A; --accent-bg:#34301F;
  --on-accent:#16130E;
  --danger:#C97F92; --danger-bg:#34222A; --success:#9BB579; --success-bg:#232A1C;
  --warn:#E0B876; --warn-bg:#2A2418; --stub:#6E6555;

  --estagio-1:#6E6555; --estagio-2:#9A8862; --estagio-3:#BE9A55; --estagio-4:#CBA25A;

}

*{box-sizing:border-box}
body{margin:0;font-family:"Public Sans",-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-3)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--surface-2);padding:var(--sp-1) var(--sp-1);border-radius:var(--r-1);font-size:var(--fs-1);font-family:"IBM Plex Mono",ui-monospace,monospace}
pre{background:var(--surface-2);padding:var(--sp-2);border-radius:var(--r-1);overflow-x:auto}
pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;margin:var(--sp-2) 0}
th,td{border:1px solid var(--border);padding:var(--sp-1) var(--sp-2);text-align:left;font-size:var(--fs-2);vertical-align:top}
th{background:var(--surface-2)}

#layout{display:grid;grid-template-columns:300px 1fr;height:100vh}

/* ---------- sidebar ---------- */
#sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:var(--sp-3);border-bottom:1px solid var(--border)}
#sidebar-header h1{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-2)}
#plataforma-seletor,#tema-seletor{width:100%;margin:0 0 var(--sp-2);padding:var(--sp-1) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:var(--fs-2);cursor:pointer}
#plataforma-seletor:focus,#tema-seletor:focus{outline:2px solid var(--accent);outline-offset:-1px}
#plataforma-aviso{margin:0 var(--sp-3) var(--sp-3);padding:var(--sp-2) var(--sp-2);border:1px solid var(--warn);border-radius:var(--r-1);background:var(--warn-bg);color:var(--warn);font-size:var(--fs-1);line-height:1.45}
#plataforma-aviso strong{display:block;margin-bottom:var(--sp-1)}
#plataforma-aviso code{background:none;padding:0;color:inherit}
#search-box{width:100%;padding:var(--sp-2) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-2)}
#type-chips{display:flex;flex-wrap:wrap;gap:var(--sp-1);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border)}
.chip{font-size:var(--fs-1);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-2);border:1px solid var(--border);background:var(--surface-2);cursor:pointer;color:var(--text-2)}
.chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#tree{flex:1;overflow-y:auto;padding:var(--sp-1)}
.tree-folder{margin-bottom:var(--sp-1)}
.tree-folder-label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);font-weight:600;color:var(--text-2);padding:var(--sp-1) var(--sp-1);cursor:pointer;display:flex;align-items:center;gap:var(--sp-1)}
.tree-folder-label:hover{background:var(--surface-2);border-radius:var(--r-1)}
.tree-children{margin-left:var(--sp-3);display:none}
.tree-children.open{display:block}
.tree-file{padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-2);border-radius:var(--r-1);cursor:pointer;font-size:var(--fs-2);display:flex;align-items:center;gap:var(--sp-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-file:hover{background:var(--surface-2)}
.tree-file.selected{background:var(--accent-bg);color:var(--accent)}
.tree-file.stub{opacity:.45}
.type-dot{width:var(--sp-2);height:var(--sp-2);border-radius:50%;flex-shrink:0;background:var(--tipo-outro)}
.type-dot.t-orquestra{background:var(--tipo-orquestra)}
.type-dot.t-backlog{background:var(--tipo-backlog)}
.type-dot.t-log{background:var(--tipo-log)}
.type-dot.t-changelog{background:var(--tipo-changelog)}
.type-dot.t-readme{background:var(--tipo-readme)}
.type-dot.t-skill{background:var(--tipo-skill)}
.type-dot.t-glossary{background:var(--tipo-glossary)}
.type-dot.t-doctrine{background:var(--tipo-doctrine)}
.type-dot.t-linkmap{background:var(--tipo-linkmap)}
.type-dot.t-script{background:var(--tipo-script)}
.type-dot.t-trilha{background:var(--tipo-trilha)}
.type-dot.t-dashboard-html{background:var(--tipo-dashboard-html)}
.type-dot.t-other-markdown{background:var(--tipo-other-markdown)}
.type-dot.t-other-pertinent{background:var(--tipo-other-pertinent)}
#reindex-btn{margin:var(--sp-2) var(--sp-3);padding:var(--sp-1);border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2);cursor:pointer;font-size:var(--fs-1);color:var(--text-2)}
#reindex-btn:hover{background:var(--border)}
#embarque-nav-btn,#versoes-nav-btn,#portfolio-nav-btn,#tour-nav-btn,#dashboard-nav-btn,#workflow-nav-btn,#nota-nav-btn,#fluxo-nav-btn{margin:0 var(--sp-3) var(--sp-3);padding:var(--sp-2);border:1px solid var(--accent);border-radius:var(--r-1);background:var(--accent-bg);cursor:pointer;font-size:var(--fs-2);font-weight:600;color:var(--accent);font-family:"Fraunces",serif}
#embarque-nav-btn:hover,#versoes-nav-btn:hover,#portfolio-nav-btn:hover,#tour-nav-btn:hover,#dashboard-nav-btn:hover,#workflow-nav-btn:hover,#nota-nav-btn:hover,#fluxo-nav-btn:hover{background:var(--accent);color:var(--bg)}
.vs-repo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.vs-repo h2{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-1);display:flex;align-items:center;gap:var(--sp-2)}
.vs-repo .caminho{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--text-2);margin:0 0 var(--sp-3);word-break:break-all}
.vs-sinal{display:inline-block;width:var(--sp-2);height:var(--sp-2);border-radius:50%;flex-shrink:0}
.vs-sinal.verde{background:var(--success)}
.vs-sinal.ambar{background:var(--warn)}
.vs-sinal.vermelho{background:var(--danger)}
.vs-sinal.cinza{background:var(--stub)}
.vs-resposta{border-left:3px solid var(--border);padding:0 0 0 var(--sp-3);margin:0 0 var(--sp-3)}
.vs-resposta.verde{border-color:var(--success)}
.vs-resposta.ambar{border-color:var(--warn)}
.vs-resposta.vermelho{border-color:var(--danger)}
.vs-resposta.cinza{border-color:var(--stub)}
.vs-resposta .pergunta{font-size:var(--fs-1);color:var(--text-2);margin:0 0 2px}
.vs-resposta .valor{font-size:var(--fs-3);font-weight:600;margin:0}
.vs-resposta .obs{font-size:var(--fs-1);color:var(--text-2);margin:2px 0 0;line-height:1.5}
.vs-arquivos{margin:var(--sp-2) 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--text-2)}
.vs-arquivos li{margin-bottom:2px;list-style:none}
.vs-arquivos li .marca{color:var(--danger)}
.vs-commits{margin:var(--sp-3) 0 0;border-top:1px solid var(--border);padding-top:var(--sp-3)}
.vs-commits h3{font-size:var(--fs-2);margin:0 0 var(--sp-2);color:var(--text-2);font-weight:600}
.vs-commit{display:grid;grid-template-columns:96px 1fr auto;gap:var(--sp-2);font-size:var(--fs-1);padding:3px 0;border-bottom:1px solid var(--border)}
.vs-commit:last-child{border-bottom:0}
.vs-commit .quando{color:var(--text-2);font-family:"IBM Plex Mono",ui-monospace,monospace}
.vs-commit .n{color:var(--stub);text-align:right;white-space:nowrap}
.vs-acoes{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.vs-rede{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-2);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.vs-rede h2{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-2)}
.vs-camada{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-2);margin-bottom:var(--sp-2)}
.vs-camada .nome{font-weight:600;white-space:nowrap}
.vs-camada .desc{color:var(--text-2);font-size:var(--fs-1);line-height:1.5}
.vs-foto{font-size:var(--fs-1);color:var(--text-2);display:flex;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-4)}
#embarque-nav-btn{border-width:2px}
.eb-parada{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow);padding:var(--sp-4);margin-bottom:var(--sp-4);max-width:640px}
.eb-parada h3{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-2)}
.eb-parada p{font-size:var(--fs-2);color:var(--text-2);line-height:1.55;margin:0 0 var(--sp-3)}
.eb-parada label.campo{display:block;font-size:var(--fs-1);color:var(--text-2);margin:0 0 var(--sp-1)}
.eb-parada input[type=text]{width:100%;padding:var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2);color:var(--text);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-2)}
.eb-opcao{display:flex;gap:var(--sp-2);align-items:flex-start;padding:var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);margin-bottom:var(--sp-1);cursor:pointer;font-size:var(--fs-2)}
.eb-opcao:hover{border-color:var(--accent)}
.eb-opcao.sim{border-color:var(--accent);background:var(--accent-bg)}
.eb-opcao small{display:block;color:var(--text-2);font-size:var(--fs-1);margin-top:2px}
.eb-passos{display:flex;gap:var(--sp-1);margin-bottom:var(--sp-4)}
.eb-passo-dot{flex:1;height:var(--sp-1);border-radius:var(--r-pill);background:var(--surface-2)}
.eb-passo-dot.feita{background:var(--estagio-2)}
.eb-passo-dot.agora{background:var(--accent)}
.eb-acoes{display:flex;gap:var(--sp-2);align-items:center;max-width:640px}
.eb-erro{color:var(--danger);font-size:var(--fs-1);margin:var(--sp-2) 0 0}

/* ---------- dashboard view ---------- */
.dash-lead{color:var(--text-2);font-size:var(--fs-2);margin:-var(--sp-2) 0 var(--sp-4)}
.dash-section{margin-bottom:var(--sp-10)}
.dash-section h2{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-4);padding-bottom:var(--sp-2);border-bottom:2px solid var(--accent)}
.dash-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3)}
.dash-kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow);padding:var(--sp-3) var(--sp-4)}
.dash-kpi-card .num{font-family:"Fraunces",serif;font-size:var(--fs-num);font-weight:600;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.dash-kpi-card .label{margin-top:var(--sp-1);font-size:var(--fs-1);color:var(--text-2)}
.dash-bar-row{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.dash-bar-row .rotulo{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1)}
.dash-bar-track{height:12px;background:var(--surface-2);border-radius:var(--r-1);overflow:hidden;border:1px solid var(--border)}
.dash-bar-fill{height:100%;background:var(--accent)}
.dash-bar-row .valor{text-align:right;font-variant-numeric:tabular-nums;font-size:var(--fs-1);color:var(--text-2)}
.dash-chart-vert{display:flex;align-items:flex-end;gap:var(--sp-2);height:150px;padding:var(--sp-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow);overflow-x:auto}
.dash-chart-vert .col{display:flex;flex-direction:column;align-items:center;min-width:38px}
.dash-chart-vert .col .val{font-size:var(--fs-1);color:var(--text-2);margin-bottom:var(--sp-1);font-variant-numeric:tabular-nums}
.dash-chart-vert .col .bar{width:22px;background:var(--accent);border-radius:var(--r-1) var(--r-1) 0 0}
.dash-chart-vert .col .dia{margin-top:var(--sp-1);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--text-2)}
.dash-esforco{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--r-2);padding:var(--sp-4);font-size:var(--fs-2);color:var(--text)}
.dash-esforco strong{color:var(--danger)}

/* ---------- workflow (kanban + pendências) ---------- */
.wf-avanco{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-3);margin-bottom:var(--sp-6)}
.wf-avanco .tit{font-weight:600;font-size:var(--fs-2);margin:0 0 var(--sp-1);color:var(--accent)}
.wf-avanco .ctx{font-size:var(--fs-1);color:var(--text-2);margin:0}
.wf-board{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3);margin-bottom:var(--sp-6)}
.wf-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:var(--sp-2);min-width:0}
.wf-col h3{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-3);margin:0 0 var(--sp-2);display:flex;justify-content:space-between;align-items:center}
.wf-col h3 .cnt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--text-2);font-weight:400}
.wf-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-1);padding:var(--sp-2) var(--sp-2);margin-bottom:var(--sp-1);cursor:pointer;font-size:var(--fs-1);overflow:hidden}
.wf-card:hover{border-color:var(--accent)}
.wf-card .et{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--accent);display:block;margin-bottom:var(--sp-1)}
.wf-card .ti{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-empty{font-size:var(--fs-1);color:var(--stub);font-style:italic;padding:var(--sp-1) 0}
.wf-pend{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-3);margin-bottom:var(--sp-2)}
.wf-pend.respondida{border-color:var(--success)}
.wf-pend.adiada-marcada{border-color:var(--warn)}
.wf-pend .tit{font-weight:600;font-size:var(--fs-3);margin:0 0 var(--sp-1)}
.wf-pend .ctx{font-size:var(--fs-1);color:var(--text-2);margin:0 0 var(--sp-2);line-height:1.5}
.wf-pend .meta{font-size:var(--fs-1);color:var(--text-2);font-family:"IBM Plex Mono",ui-monospace,monospace;margin:var(--sp-2) 0 0;border-top:1px solid var(--border);padding-top:var(--sp-1);display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.wf-badges{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-1)}
.wf-b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-2)}
.wf-b-incremento{background:var(--accent-bg);color:var(--accent)}
.wf-b-sustentacao{background:var(--surface-2);color:var(--text-2)}
.wf-b-essencial{background:var(--danger-bg);color:var(--danger)}
.wf-b-adiada{background:var(--warn-bg);color:var(--warn)}
.wf-b-aberta{background:var(--surface-2);color:var(--text-2)}
.wf-b-respondida{background:var(--success-bg);color:var(--success)}
.wf-b-adiada-marcada{background:var(--warn-bg);color:var(--warn)}
.wf-b-nao-parseavel{background:var(--danger-bg);color:var(--danger)}
.wf-perg{margin:var(--sp-2) 0 0;padding-top:var(--sp-2);border-top:1px dashed var(--border)}
.wf-perg-t{font-size:var(--fs-1);margin:0 0 var(--sp-1);font-weight:600;color:var(--text)}
.wf-opt{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-1) var(--sp-1);border-radius:var(--r-1);cursor:pointer;font-size:var(--fs-1);line-height:1.45}
.wf-opt:hover{background:var(--surface-2)}
.wf-opt input{margin:var(--sp-1) 0 0;cursor:pointer;flex-shrink:0}
.wf-opt.marcada{background:var(--success-bg)}
.wf-opt .lb{font-weight:600}
.wf-opt .rz{color:var(--text-2)}
.wf-outra{display:flex;gap:var(--sp-1);margin-top:var(--sp-1);padding-left:var(--sp-1)}
.wf-outra input[type=text]{flex:1;padding:var(--sp-1) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-1);font-family:inherit;background:var(--surface-2);color:var(--text)}
.wf-outra button{padding:var(--sp-1) var(--sp-3);border:1px solid var(--accent);border-radius:var(--r-1);background:var(--accent-bg);color:var(--accent);cursor:pointer;font-size:var(--fs-1);font-weight:600;font-family:inherit}
.wf-filtros{display:flex;gap:var(--sp-1);align-items:center;margin:0 0 var(--sp-3);flex-wrap:wrap}
.wf-raw{font-size:var(--fs-1);background:var(--surface-2);padding:var(--sp-2);border-radius:var(--r-1);max-height:150px;overflow:auto;white-space:pre-wrap;margin:var(--sp-1) 0 0}

/* ---------- briefing pra IA (modal) ---------- */
#brf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:var(--sp-6)}
#brf-overlay.open{display:flex}
#brf-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow);width:min(820px,100%);max-height:86vh;display:flex;flex-direction:column;padding:var(--sp-4) var(--sp-4)}
#brf-box h2{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-1)}
#brf-box .sub{font-size:var(--fs-1);color:var(--text-2);margin:0 0 var(--sp-2)}
#brf-texto{flex:1;min-height:300px;width:100%;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);line-height:1.5;padding:var(--sp-2);border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface-2);color:var(--text);resize:vertical}
#brf-acoes{display:flex;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-2)}
#brf-acoes button{padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2);cursor:pointer;font-size:var(--fs-2);font-family:inherit;color:var(--text)}
#brf-acoes button.prim{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.brf-btn{padding:var(--sp-1) var(--sp-3);border:1px solid var(--accent);border-radius:var(--r-1);background:var(--accent-bg);color:var(--accent);cursor:pointer;font-size:var(--fs-1);font-weight:600;font-family:inherit}
.brf-btn:disabled{opacity:.45;cursor:default}

/* ---------- fluxo (checklist guiado) ---------- */
.fx-passo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-3);margin-bottom:var(--sp-2)}
.fx-passo h3{font-family:"Fraunces",serif;font-size:var(--fs-3);margin:0 0 var(--sp-1)}
.fx-crit{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-1);border-radius:var(--r-1);cursor:pointer;font-size:var(--fs-2)}
.fx-crit:hover{background:var(--surface-2)}
.fx-crit.sim{background:var(--success-bg)}
.fx-veredito{margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);font-size:var(--fs-2);font-weight:600}
.fx-veredito.sbi{background:var(--success-bg);color:var(--success)}
.fx-veredito.fica{background:var(--warn-bg);color:var(--warn)}

/* ---------- projeto (view de um projeto) ---------- */
.pj-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp-2);margin-bottom:var(--sp-1)}
.pj-head h1{margin:0;border:0;padding:0}
.pj-git{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--text-2);display:flex;gap:var(--sp-3);flex-wrap:wrap;margin:var(--sp-1) 0 var(--sp-4)}
.pj-mat{display:grid;grid-template-columns:90px 1fr 34px;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-1);font-size:var(--fs-1)}
.pj-mat .rot{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--text-2)}
.pj-mat-track{height:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden}
.pj-mat-fill{height:100%;background:var(--accent)}
.pj-mat .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.pj-sec{margin-bottom:var(--sp-6)}
.pj-sec h2{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-4);margin:0 0 var(--sp-2);padding-bottom:var(--sp-1);border-bottom:1px solid var(--border)}
.pj-lista{margin:0;padding-left:var(--sp-4);font-size:var(--fs-1);line-height:1.6;color:var(--text-2)}
.pj-anotar{display:flex;gap:var(--sp-2);margin:var(--sp-2) 0 var(--sp-1);flex-wrap:wrap}
.pj-anotar input[type=text]{flex:1;min-width:240px;padding:var(--sp-2) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-2);font-family:inherit;background:var(--surface);color:var(--text)}
.pj-anotar select{padding:var(--sp-2) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-1);font-family:inherit;background:var(--surface);color:var(--text)}
.pj-anotar button{padding:var(--sp-2) var(--sp-3);border:1px solid var(--accent);border-radius:var(--r-1);background:var(--accent-bg);color:var(--accent);cursor:pointer;font-weight:600;font-size:var(--fs-2);font-family:inherit}
.pj-anotar button:disabled{opacity:.5;cursor:default}
.pj-hint{font-size:var(--fs-1);color:var(--text-2);margin:0 0 var(--sp-3)}
.pj-doc{display:inline-block;margin:0 var(--sp-1) var(--sp-1) 0;font-size:var(--fs-1);padding:var(--sp-1) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2);cursor:pointer}
.pj-doc:hover{border-color:var(--accent)}
.pill-noar-ok{background:var(--success-bg);color:var(--success)}
.pill-noar-fora{background:var(--danger-bg);color:var(--danger)}

/* ---------- nota (captura crua) ---------- */
#nota-texto{width:100%;max-width:640px;padding:var(--sp-2);border:1px solid var(--border);border-radius:var(--r-2);font-family:inherit;font-size:var(--fs-3);background:var(--surface);color:var(--text)}
#nota-salvar-btn{padding:var(--sp-2) var(--sp-4);border:1px solid var(--accent);border-radius:var(--r-1);background:var(--accent-bg);color:var(--accent);cursor:pointer;font-weight:600;font-family:inherit;font-size:var(--fs-2)}
#nota-salvar-btn:disabled{opacity:.5;cursor:default}
#nota-recentes p{font-size:var(--fs-2)}

/* ---------- main pane ---------- */
#main{overflow-y:auto;padding:var(--sp-6) var(--sp-8)}
#breadcrumb{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);color:var(--text-2);margin-bottom:var(--sp-2)}
#breadcrumb a{color:var(--text-2)}
#meta-bar{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap}
.badge{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:var(--fs-1);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-2);font-weight:500}
.badge-processed{background:var(--success-bg);color:var(--success)}
.badge-raw{background:var(--surface-2);color:var(--text-2)}
.badge-orphan{background:var(--warn-bg);color:var(--warn)}
.badge-type{background:var(--accent-bg);color:var(--accent)}
.badge-stage-entrada{background:var(--danger-bg);color:var(--danger)}
.badge-stage-pendente{background:var(--warn-bg);color:var(--warn)}
.badge-stage-historico{background:var(--surface-2);color:var(--text-2)}
#meta-path{font-size:var(--fs-1);color:var(--text-2);font-family:"IBM Plex Mono",ui-monospace,monospace}
#content{max-width:900px;line-height:1.6}
#content h1{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-num);border-bottom:2px solid var(--accent);padding-bottom:var(--sp-2)}
#content h2{font-family:"Fraunces",serif;font-weight:600;font-size:var(--fs-lg);margin-top:var(--sp-6)}
#content h3{font-size:var(--fs-4);font-weight:600}
#welcome{color:var(--text-2);max-width:640px}
.linkmap-banner{background:var(--warn-bg);color:var(--warn);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-1);font-size:var(--fs-1);margin-bottom:var(--sp-3)}

/* backlog checkboxes */
.backlog-checkbox{margin-right:var(--sp-1)}
.backlog-line{display:flex;align-items:flex-start;gap:var(--sp-1);padding:var(--sp-1) 0}

/* log table view */
#log-view table{font-size:var(--fs-1)}
.arrow-chip{display:inline-block;background:var(--accent-bg);color:var(--accent);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-2);font-size:var(--fs-1);cursor:pointer}
#log-filter{margin-bottom:var(--sp-2);padding:var(--sp-1) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-2);width:280px}

/* search results */
.search-result{padding:var(--sp-2) 0;border-bottom:1px solid var(--border);cursor:pointer}
.search-result:hover{background:var(--surface-2)}
.search-result-title{font-weight:600}
.search-result-path{font-size:var(--fs-1);color:var(--text-2);font-family:monospace}
.search-result-snippet{font-size:var(--fs-1);color:var(--text-2);margin-top:var(--sp-1)}

#toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-1);font-size:var(--fs-2);opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* Tour — o documento de trilha da plataforma, renderizado por parada */
.tour-nav{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin:var(--sp-2) 0 var(--sp-4);position:sticky;top:0;background:var(--bg);padding:var(--sp-2) 0;z-index:2;border-bottom:1px solid var(--border)}
.tour-step{padding:var(--sp-1) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);cursor:pointer;font-size:var(--fs-1);font-family:"IBM Plex Mono",monospace;color:var(--text-2)}
.tour-step:hover{border-color:var(--accent);color:var(--text)}
.tour-step.active{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.tour-step.done::before{content:"✓ ";opacity:.8}
.tour-footer{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp-6);padding-top:var(--sp-3);border-top:1px solid var(--border);gap:var(--sp-2)}
.tour-footer button{padding:var(--sp-2) var(--sp-3);border:1px solid var(--accent);border-radius:var(--r-1);background:var(--accent-bg);color:var(--accent);cursor:pointer;font-weight:600}
.tour-footer button:hover{background:var(--accent);color:var(--bg)}
.tour-footer button[disabled]{opacity:.4;cursor:default}
.tour-footer .tour-progress{font-size:var(--fs-1);color:var(--text-2)}
.tour-mermaid{border:1px dashed var(--accent);border-radius:var(--r-2);padding:var(--sp-2) var(--sp-3);background:var(--surface);margin:var(--sp-3) 0}
.tour-mermaid .tour-mermaid-label{font-size:var(--fs-1);color:var(--text-2);margin-bottom:var(--sp-1);font-family:"IBM Plex Mono",monospace}
.tour-mermaid pre{margin:0;max-height:260px;overflow:auto;font-size:var(--fs-1)}
.tour-mermaid.rendered{border-style:solid;text-align:center;overflow-x:auto}
.tour-mermaid.rendered svg{max-width:100%;height:auto}
.tour-body blockquote{border-left:3px solid var(--accent);margin:var(--sp-3) 0;padding:var(--sp-1) var(--sp-3);background:var(--accent-bg);border-radius:0 var(--r-1) var(--r-1) 0}

/* ---------- portfólio ---------- */
.pf-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.pf-head h1{margin:0;border:0;padding:0}
.pf-kpis{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.pf-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:var(--sp-2) var(--sp-3);min-width:86px}
.pf-kpi .n{font-family:"Fraunces",serif;font-size:var(--fs-lg);font-weight:600;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.pf-kpi .l{font-size:var(--fs-1);color:var(--text-2);margin-top:var(--sp-1);text-transform:uppercase;letter-spacing:.04em}
.pf-filtros{display:flex;flex-wrap:wrap;gap:var(--sp-1);align-items:center;margin:0 0 var(--sp-4);padding:var(--sp-2) 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.pf-filtros .sep{width:1px;height:18px;background:var(--border);margin:0 var(--sp-1)}
.pf-filtros input{padding:var(--sp-1) var(--sp-2);border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-1);min-width:180px;background:var(--surface);color:var(--text)}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:var(--sp-3)}
#content.pf-wide{max-width:none}
.pf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow);padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}

<script src="/app/templates/vendor/marked.min.js"></script>
<script src="/app/templates/vendor/mermaid.min.js"></script>
<script>
// ============================================================
// Estado global
// ============================================================
let ENTRIES = [];
// Resumo da plataforma ativa (nome, caminho, estágios, tipos), vindo do
// /api/index. Tudo que a interface escreve sobre estágio, sigla ou caminho sai
// daqui — nada de nome de plataforma escrito à mão na tela.
let PLAT = null;
const plEstagios = () => (PLAT && PLAT.estagios) || [];
const plEstagio = (n) => plEstagios()[n - 1] || null;
const plNome = (n, plural) => { const e = plEstagio(n); return e ? (plural ? (e.plural || e.nome) : e.nome) : ""; };
const plSigla = (n) => { const e = plEstagio(n); return e ? e.sigla : ""; };
const plUltimo = () => plEstagios().length;
const plCadeia = () => plEstagios().map(e => e.sigla).join("→");
const plPrefixo = () => (PLAT && PLAT.nome ? PLAT.nome : "Estação") + " / ";
let ACTIVE_TYPE_FILTER = null;
let SELECTED_PATH = null;

const TYPE_LABELS = {
  "orquestra": "orquestra", "backlog": "backlog", "log": "log",
  "changelog": "changelog", "readme": "readme", "skill": "skill",
  "glossary": "glossário", "doctrine": "doutrina", "linkmap": "mapa de links", "script": "script", "trilha": "trilha",
  "dashboard-html": "dashboard", "other-markdown": "outro (.md)", "other-pertinent": "outro"
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ============================================================
// Carregamento do índice
// ============================================================
async function loadIndex(){
  const r = await fetch("/api/index");
  const data = await r.json();
  ENTRIES = data.entries;
  PLAT = data.plataforma || null;
  renderPlataformaAviso(data);
  renderBoasVindas(data);
  TOUR_PATH = (data.plataforma && data.plataforma.trilha) || null;
  document.getElementById("tour-nav-btn").hidden = !TOUR_PATH;
  renderTypeChips();
  renderTree();
}

// ============================================================
// Seletor de plataforma
// ============================================================
// A Estação opera N plataformas; esta é a única forma de trocar sem reiniciar.
// Quando a raiz ativa não é uma plataforma (pasta vazia, marcador ausente), o
// servidor sobe assim mesmo e o aviso abaixo diz o motivo — nenhuma aba estoura.
// A tela inicial diz qual plataforma está aberta e onde ela fica — antes ela
// nomeava uma plataforma específica, o que virou mentira no momento em que a
// Estação passou a operar mais de uma.
function renderBoasVindas(data){
  const el = document.getElementById("welcome-lead");
  if (!el) return;
  const p = data.plataforma;
  if (!p || data.plataforma_ok === false){
    el.textContent = "Nenhuma plataforma aberta.";
    return;
  }
  const estagios = (p.estagios || []).map(e => e.plural || e.nome).join(" · ");
  el.innerHTML = `Plataforma <strong>${escapeHtml(p.nome)}</strong>, em ` +
    `<code>${escapeHtml(p.caminho)}</code> — ${data.count} arquivos indexados` +
    (estagios ? `, em ${(p.estagios || []).length} estágios: ${escapeHtml(estagios)}.` : ".");
}

function renderPlataformaAviso(data){
  const box = document.getElementById("plataforma-aviso");
  // Sem plataforma, o app não tem nada a mostrar — e a única coisa útil que ele
  // pode fazer é ajudar a criar a primeira. Por isso o Embarque abre sozinho.
  if (data.plataforma_ok === false && !EB_JA_ABRIU){
    EB_JA_ABRIU = true;
    setTimeout(openEmbarqueView, 0);
  }
  if (data.plataforma_ok === false){
    const nome = data.plataforma ? data.plataforma.caminho : "(raiz não resolvida)";
    box.innerHTML = "<strong>Nenhuma plataforma aberta</strong>" +
      "Esta pasta não tem <code>" +
      escapeHtml(data.plataforma ? data.plataforma.marcador : "_indice.md") +
      "</code>, então não há o que indexar:<br><code>" + escapeHtml(nome) + "</code>";
    box.hidden = false;
  } else {
    box.hidden = true;
  }
}

async function carregarPlataformas(){
  const sel = document.getElementById("plataforma-seletor");
  let dados;
  try {
    dados = await (await fetch("/api/plataformas")).json();
  } catch (e) {
    sel.hidden = true;
    return;
  }
  const lista = dados.plataformas || [];
  sel.innerHTML = "";
  lista.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.caminho;
    opt.textContent = p.nome + (p.existe ? "" : " (pasta não encontrada)");
    opt.title = p.caminho;
    opt.selected = !!p.ativa;
    opt.disabled = !p.existe;
    sel.appendChild(opt);
  });
  // uma plataforma só: o seletor não decide nada, e ocupa espaço à toa
  sel.hidden = lista.length < 2;
}

async function trocarPlataforma(caminho){
  toast("Trocando de plataforma…");
  let r;
  try {
    r = await (await fetch("/api/plataforma/ativar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({caminho})
    })).json();
  } catch (e) {
    toast("Falha ao trocar de plataforma");
    return;
  }
  if (r.error){ toast(r.error); await carregarPlataformas(); return; }
  ACTIVE_TYPE_FILTER = null;
  document.getElementById("content").innerHTML = "";
  document.getElementById("breadcrumb").textContent = "";
  document.getElementById("meta-bar").innerHTML = "";
  await carregarPlataformas();
  await loadIndex();
  toast(r.plataforma_ok ? `${r.plataforma.nome}: ${r.count} arquivos`
                        : `${r.plataforma.nome}: nada a indexar`);
}

async function reindex(){
  toast("Reindexando…");
  await fetch("/api/reindex", {method: "POST"});
  await loadIndex();
  toast("Índice atualizado");
}

// ============================================================
// Sidebar — chips de tipo
// ============================================================
function renderTypeChips(){
  const counts = {};
  ENTRIES.forEach(e => counts[e.type] = (counts[e.type]||0)+1);
  const container = document.getElementById("type-chips");
  container.innerHTML = "";
  Object.keys(TYPE_LABELS).forEach(type => {
    if (!counts[type]) return;
    const chip = document.createElement("div");
    chip.className = "chip" + (ACTIVE_TYPE_FILTER === type ? " active" : "");
    chip.textContent = `${TYPE_LABELS[type]} (${counts[type]})`;
    chip.onclick = () => {
      ACTIVE_TYPE_FILTER = (ACTIVE_TYPE_FILTER === type) ? null : type;
      renderTypeChips();
      renderTree();
    };
    container.appendChild(chip);
  });
}

// ============================================================
// Sidebar — árvore de pastas
// ============================================================
function buildTree(entries){
  const root = {name: "", children: {}, files: []};
  entries.forEach(e => {
    const parts = e.path.split("/");
    const fileName = parts.pop();
    let node = root;
    for (const part of parts){
      if (!node.children[part]) node.children[part] = {name: part, children: {}, files: []};
      node = node.children[part];
    }
    node.files.push(e);
  });
  return root;
}

function renderTree(){
  const q = document.getElementById("search-box").value.trim().toLowerCase();
  let filtered = ENTRIES;
  if (ACTIVE_TYPE_FILTER) filtered = filtered.filter(e => e.type === ACTIVE_TYPE_FILTER);
  if (q) filtered = filtered.filter(e => e.path.toLowerCase().includes(q) || e.title.toLowerCase().includes(q));

  const tree = buildTree(filtered);
  const container = document.getElementById("tree");
  container.innerHTML = "";
  renderTreeNode(tree, container, true);
}

function renderTreeNode(node, container, isRoot){
  const folderNames = Object.keys(node.children).sort((a,b)=>a.localeCompare(b));
  folderNames.forEach(fname => {
    const child = node.children[fname];
    const wrapper = document.createElement("div");
    wrapper.className = "tree-folder";
    const label = document.createElement("div");
    label.className = "tree-folder-label";
    label.innerHTML = `<span class="arrow">▸</span> ${escapeHtml(fname)}`;
    const childrenDiv = document.createElement("div");
    childrenDiv.className = "tree-children";
    label.onclick = () => {
      childrenDiv.classList.toggle("open");
      label.querySelector(".arrow").textContent = childrenDiv.classList.contains("open") ? "▾" : "▸";
    };
    wrapper.appendChild(label);
    wrapper.appendChild(childrenDiv);
    renderTreeNode(child, childrenDiv, false);
    container.appendChild(wrapper);
  });

  const files = node.files.slice().sort((a,b) => {
    // orquestras/backlogs primeiro, depois alfabético
    const aOrq = a.type === "orquestra" ? 0 : 1;
    const bOrq = b.type === "orquestra" ? 0 : 1;
    if (aOrq !== bOrq) return aOrq - bOrq;
    return a.path.localeCompare(b.path);
  });
  files.forEach(e => {
    const item = document.createElement("div");
    item.className = "tree-file" + (e.is_stub ? " stub" : "") + (e.path === SELECTED_PATH ? " selected" : "");
    // a cor sai do token .t-<tipo> no :root, nunca de literal aqui
    const dot = `<span class="type-dot t-${e.type}"></span>`;
    item.innerHTML = `${dot} ${escapeHtml(e.title || e.path.split("/").pop())}`;
    item.title = e.path;
    item.onclick = () => openFile(e.path);
    container.appendChild(item);
  });
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

// ============================================================
// Main pane — abrir arquivo
// ============================================================
async function openFile(path){
  SELECTED_PATH = path;
  renderTree();
  if (PLAT && PLAT.registro && path === PLAT.registro){
    await openLogView();
    return;
  }
  if (path === TOUR_PATH){
    await openTourView();
    return;
  }
  const r = await fetch("/api/file?path=" + encodeURIComponent(path));
  const data = await r.json();
  if (data.error){ toast("Erro: " + data.error); return; }
  renderFile(data.entry, data.raw);
}

function renderBreadcrumb(path){
  const parts = path.split("/");
  const bc = document.getElementById("breadcrumb");
  let acc = "";
  const segs = parts.map((p, i) => {
    acc += (i>0?"/":"") + p;
    return `<span>${escapeHtml(p)}</span>`;
  });
  bc.innerHTML = escapeHtml(plPrefixo()) + segs.join(" / ");
}

function renderMetaBar(entry){
  const bar = document.getElementById("meta-bar");
  let badges = "";
  badges += `<span class="badge badge-type">${TYPE_LABELS[entry.type]||entry.type}</span>`;
  if (entry.processed){
    badges += `<span class="badge badge-processed">processado (${escapeHtml(entry.processed_id||"")})</span>`;
  } else {
    badges += `<span class="badge badge-raw">cru</span>`;
  }
  if (entry.orphaned){
    badges += `<span class="badge badge-orphan" title="Pasta de projeto que o índice canônico da plataforma não lista">fora do índice</span>`;
  }
  if (entry.lifecycle_stage){
    const stageLabel = {"entrada": "entrada — ninguém viu ainda", "pendente": "pendente — sem destino", "historico": "histórico — já seguiu"}[entry.lifecycle_stage] || entry.lifecycle_stage;
    badges += `<span class="badge badge-stage badge-stage-${entry.lifecycle_stage}">${stageLabel}</span>`;
  }
  bar.innerHTML = badges + `<span id="meta-path">${escapeHtml(entry.path)} · ${entry.size_bytes}B · ${escapeHtml(entry.mtime)}</span>`;
}

function renderFile(entry, raw){
  document.getElementById("content").classList.remove("pf-wide");
  renderBreadcrumb(entry.path);
  renderMetaBar(entry);
  const content = document.getElementById("content");
  content.innerHTML = "";

  if (entry.type === "linkmap"){
    const banner = document.createElement("div");
    banner.className = "linkmap-banner";
    banner.textContent = "Mantido manualmente — pode divergir do estado real da árvore.";
    content.appendChild(banner);
  }

  const body = document.createElement("div");
  if (entry.type === "backlog"){
    renderBacklogBody(body, entry, raw);
  } else if (entry.path.endsWith(".html") || entry.path.endsWith(".htm")){
    body.innerHTML = `<p><a class="pf-local" href="/files/${entry.path.split("/").map(encodeURIComponent).join("/")}" target="_blank" rel="noopener">Abrir este HTML renderizado, em nova aba</a></p><pre><code>${escapeHtml(raw.slice(0,3000))}${raw.length>3000?"\n…":""}</code></pre>`;
  } else if (entry.path.endsWith(".py")){
    body.innerHTML = `<pre><code>${escapeHtml(raw)}</code></pre>`;
  } else {
    // strip frontmatter before rendering
    const stripped = raw.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");
    body.innerHTML = marked.parse(stripped);
  }
  content.appendChild(body);
}

// ============================================================
// Backlog — renderiza checkboxes reais, liga ao toggle endpoint
// ============================================================
function renderBacklogBody(container, entry, raw){
  const stripped = raw.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");
  const rawLines = raw.split(/\r?\n/);
  const offset = raw.length - stripped.length > 0 ? (raw.split(/\r?\n/).length - stripped.split(/\r?\n/).length) : 0;

  // Render markdown normalmente, depois faz post-processing pra achar linhas de checkbox
  container.innerHTML = marked.parse(stripped);

  // Constrói uma lista de {lineIndex, text} pra cada linha checkbox no arquivo cru
  const checkboxLines = [];
  rawLines.forEach((line, idx) => {
    if (line.includes("- [ ] ") || line.includes("- [x] ")){
      checkboxLines.push({idx, text: line});
    }
  });

  // Substitui os <li> correspondentes por checkboxes reais interativos.
  // Estratégia simples: percorre os <li> do DOM na ordem e casa 1:1 com checkboxLines
  // (marked já reconhece "- [ ] " como task list item com <input disabled>).
  const domCheckboxes = container.querySelectorAll('li input[type="checkbox"]');
  domCheckboxes.forEach((input, i) => {
    const match = checkboxLines[i];
    if (!match) return;
    input.disabled = false;
    input.classList.add("backlog-checkbox");
    input.onchange = () => toggleBacklogCheckbox(entry.path, match.idx, match.text, input);
  });

  if (domCheckboxes.length === 0){
    const note = document.createElement("p");
    note.style.color = "var(--text-2)";
    note.style.fontSize = "12px";
    note.textContent = "(nenhum item de checkbox detectado neste backlog)";
    container.appendChild(note);
  }
}

async function toggleBacklogCheckbox(path, lineNumber, expectedText, inputEl){
  inputEl.disabled = true;
  try{
    const r = await fetch("/api/backlog/toggle", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({path, line_number: lineNumber, expected_text: expectedText})
    });
    const data = await r.json();
    if (!r.ok){
      toast("Erro: " + (data.error || r.status));
      inputEl.checked = !inputEl.checked;
      inputEl.disabled = false;
      return;
    }
    toast("Backlog atualizado");
    // reabre o arquivo pra refletir o novo estado com line numbers corretos
    await openFile(path);
  } catch(err){
    toast("Falha de rede: " + err);
    inputEl.disabled = false;
  }
}

// ============================================================
// LOG central — view estruturada
// ============================================================
async function openLogView(){
  document.getElementById("content").classList.remove("pf-wide");
  renderBreadcrumb((PLAT && PLAT.registro) || "");
  document.getElementById("meta-bar").innerHTML = `<span class="badge badge-type">registro</span>`;
  const r = await fetch("/api/log");
  const data = await r.json();
  const content = document.getElementById("content");
  content.innerHTML = "";

  const filterInput = document.createElement("input");
  filterInput.id = "log-filter";
  filterInput.placeholder = "Filtrar por ID, local, resumo…";
  content.appendChild(filterInput);

  const tableWrap = document.createElement("div");
  content.appendChild(tableWrap);

  function draw(){
    const q = filterInput.value.trim().toLowerCase();
    let rows = data.rows;
    if (q) rows = rows.filter(row =>
      (row.id||"").toLowerCase().includes(q) ||
      (row.local||"").toLowerCase().includes(q) ||
      (row.resumo||"").toLowerCase().includes(q)
    );
    let html = "<table><thead><tr><th>ID</th><th>Data</th><th>Etapa</th><th>Local</th><th>Resumo</th><th>Link</th></tr></thead><tbody>";
    rows.forEach(row => {
      let etapaCell = escapeHtml(row.etapa);
      if (row.arrow_target){
        etapaCell = etapaCell.replace(/→.*/, "") + ` <span class="arrow-chip" data-target="${escapeHtml(row.arrow_target)}">→ ${escapeHtml(row.arrow_target)}</span>`;
      }
      html += `<tr>
        <td><code>${escapeHtml(row.id)}</code></td>
        <td>${escapeHtml(row.data)}</td>
        <td>${etapaCell}</td>
        <td>${escapeHtml(row.local)}</td>
        <td>${escapeHtml(row.resumo)}</td>
        <td>${row.link_href ? `<a href="#" data-href="${escapeHtml(row.link_href)}">${escapeHtml(row.link_text)}</a>` : ""}</td>
      </tr>`;
    });
    html += "</tbody></table>";
    tableWrap.innerHTML = html;

    tableWrap.querySelectorAll(".arrow-chip").forEach(chip => {
      chip.onclick = () => tryOpenTarget(chip.dataset.target);
    });
    tableWrap.querySelectorAll("a[data-href]").forEach(a => {
      a.onclick = (ev) => { ev.preventDefault(); tryOpenTarget(a.dataset.href); };
    });
  }

  filterInput.oninput = draw;
  draw();
}


// ============================================================
// Tour — a trilha declarada pela plataforma, renderizada uma parada por vez
// ============================================================
// A trilha é um .md comum (fonte única de verdade, editável fora daqui).
// Esta view só a fatia por "## " (uma parada por seção de nível 2), mostra
// uma parada por vez com navegação, marca as já vistas (localStorage) e
// deixa os links relativos resolverem contra o índice via tryOpenTarget,
// como em qualquer outro arquivo. Blocos ```mermaid são renderizados pelo
// mermaid.min.js vendorizado (vendor/, carregado no <head>); erro de
// sintaxe ou lib ausente caem em modo fonte — ver renderMermaidBlocks.
// o caminho da trilha vem do config da plataforma ativa (chave `trilha`).
// Plataforma que nao declara uma simplesmente nao tem aba Tour.
let TOUR_PATH = null;
const TOUR_DONE_KEY = "estacao.tour.done";
let TOUR_STEPS = [];
let TOUR_CURRENT = 0;

function tourDone(){
  try { return new Set(JSON.parse(localStorage.getItem(TOUR_DONE_KEY) || "[]")); } catch(e){ return new Set(); }
}
function tourMarkDone(idx){
  try {
    const done = tourDone(); done.add(idx);
    localStorage.setItem(TOUR_DONE_KEY, JSON.stringify([...done]));
  } catch(e){}
}

function splitTourSteps(markdown){
  // separa preâmbulo (antes do primeiro "## ") e seções "## ..."
  const lines = markdown.split(/\r?\n/);
  const steps = [];
  let cur = {title: "Início", body: []};
  let inFence = false;
  for (const ln of lines){
    if (/^```/.test(ln)) inFence = !inFence;
    if (!inFence && /^## /.test(ln)){
      steps.push(cur);
      cur = {title: ln.replace(/^## /, "").trim(), body: []};
      continue;
    }
    if (!inFence && /^---\s*$/.test(ln)) continue; // separadores visuais entre paradas
    cur.body.push(ln);
  }
  steps.push(cur);
  return steps.filter(s => s.body.join("").trim().length > 0 || s.title !== "Início");
}

function tourShortLabel(title){
  const m = title.match(/^(N\d)\s*—\s*(.+?)(\s*\(.*\))?$/);
  if (m) return `${m[1]} ${m[2]}`;
  return title.length > 26 ? title.slice(0, 24) + "…" : title;
}

let MERMAID_READY = false;
function ensureMermaid(){
  if (MERMAID_READY || typeof mermaid === "undefined") return MERMAID_READY;
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
  mermaid.initialize({startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict",
    fontFamily: '"Public Sans", sans-serif'});
  MERMAID_READY = true;
  return true;
}

// Blocos ```mermaid da trilha: renderiza com o mermaid.min.js vendorizado
// (app/templates/vendor/, MIT, 10.9.1). Se a lib não carregou ou o diagrama
// tem erro de sintaxe, cai no modo "fonte" — a trilha continua legível.
async function renderMermaidBlocks(container){
  const blocks = [...container.querySelectorAll("pre > code.language-mermaid")];
  if (!blocks.length) return;
  const ok = ensureMermaid();
  for (const [i, code] of blocks.entries()){
    const pre = code.parentElement;
    const src = code.textContent;
    const wrap = document.createElement("div");
    wrap.className = "tour-mermaid";
    pre.replaceWith(wrap);
    if (!ok){
      wrap.innerHTML = `<div class="tour-mermaid-label">diagrama (fonte Mermaid — mermaid.min.js não carregou)</div>`;
      wrap.appendChild(pre);
      continue;
    }
    try{
      const {svg} = await mermaid.render(`tour-mmd-${Date.now()}-${i}`, src);
      wrap.classList.add("rendered");
      wrap.innerHTML = svg;
    } catch(err){
      wrap.innerHTML = `<div class="tour-mermaid-label">diagrama com erro de sintaxe Mermaid (${escapeHtml(String(err.message||err).slice(0,120))}) — fonte abaixo</div>`;
      wrap.appendChild(pre);
    }
  }
}

async function openTourView(){
  if (!TOUR_PATH){
    document.getElementById("content").innerHTML =
      `<p class="dash-lead">Esta plataforma nao declara uma trilha de leitura ` +
      `(chave <code>trilha</code> do <code>plataforma.json</code>).</p>`;
    return;
  }
  SELECTED_PATH = TOUR_PATH; // faz os links relativos resolverem a partir da pasta da trilha
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  renderBreadcrumb(TOUR_PATH);
  document.getElementById("meta-bar").innerHTML = `<span class="badge badge-type">trilha</span><span id="meta-path">${escapeHtml(TOUR_PATH)} · uma parada por vez · links abrem aqui dentro</span>`;
  const content = document.getElementById("content");
  content.innerHTML = `<p class="dash-lead">Carregando trilha…</p>`;

  const r = await fetch("/api/file?path=" + encodeURIComponent(TOUR_PATH));
  const data = await r.json();
  if (data.error){
    content.innerHTML = `<p class="dash-lead">A trilha não está no índice (${escapeHtml(data.error)}). O <code>plataforma.json</code> aponta para <code>${escapeHtml(TOUR_PATH)}</code>.</p>`;
    return;
  }
  const stripped = data.raw.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");
  TOUR_STEPS = splitTourSteps(stripped);
  TOUR_CURRENT = 0;
  drawTourStep();
}

function drawTourStep(){
  const content = document.getElementById("content");
  content.innerHTML = "";
  const done = tourDone();

  const nav = document.createElement("div");
  nav.className = "tour-nav";
  TOUR_STEPS.forEach((st, i) => {
    const b = document.createElement("div");
    b.className = "tour-step" + (i === TOUR_CURRENT ? " active" : "") + (done.has(i) && i !== TOUR_CURRENT ? " done" : "");
    b.textContent = tourShortLabel(st.title);
    b.title = st.title;
    b.onclick = () => { TOUR_CURRENT = i; drawTourStep(); };
    nav.appendChild(b);
  });
  content.appendChild(nav);

  const st = TOUR_STEPS[TOUR_CURRENT];
  const body = document.createElement("div");
  body.className = "tour-body";
  const heading = TOUR_CURRENT === 0 ? "" : `## ${st.title}\n\n`;
  body.innerHTML = marked.parse(heading + st.body.join("\n"));
  renderMermaidBlocks(body);
  content.appendChild(body);

  const footer = document.createElement("div");
  footer.className = "tour-footer";
  const prev = document.createElement("button");
  prev.textContent = "← Anterior";
  prev.disabled = TOUR_CURRENT === 0;
  prev.onclick = () => { TOUR_CURRENT--; drawTourStep(); };
  const prog = document.createElement("span");
  prog.className = "tour-progress";
  prog.textContent = `parada ${TOUR_CURRENT + 1} de ${TOUR_STEPS.length} · ${done.size} vista(s)`;
  const next = document.createElement("button");
  const last = TOUR_CURRENT === TOUR_STEPS.length - 1;
  next.textContent = last ? "Concluir ✓" : "Li esta parada → próxima";
  next.onclick = () => {
    tourMarkDone(TOUR_CURRENT);
    if (last){ toast("Trilha concluída — agora responda o teste de controle"); drawTourStep(); return; }
    TOUR_CURRENT++; drawTourStep();
    document.getElementById("main").scrollTo({top: 0, behavior: "smooth"});
  };
  footer.appendChild(prev); footer.appendChild(prog); footer.appendChild(next);
  content.appendChild(footer);
}

// ============================================================
// Portfólio — hub de tudo que "roda", por projeto (GET /api/portfolio)
// ============================================================
// Dados vêm de app/portfolio.py (curadoria em portfolio.json por projeto).
// Filtros são estado de tela, não de servidor. Links locais (/files/…,
// launch) só funcionam no servidor local — o snapshot estático os desliga.
let PF = null;
const PF_FILTRO = {tipo: null, status: null, kind: null, q: "", mostrarRascunho: false};
const PF_KIND_LABEL = {launcher: "abrir (.bat)", binario: "executável", servidor: "servidor (python)", prototipo: "protótipo", build: "build", doc: "documento", design: "design"};
const PF_ABERTOS = new Set();

function pfStatusClass(status){
  const s = (status||"").toLowerCase();
  if (s.startsWith("ativo")) return "pill-ativo";
  if (s.includes("idea")) return "pill-idea";
  if (s.includes("early")) return "pill-early";
  if (s.includes("adormec")) return "pill-adormecida";
  if (/^v\d/.test(s)) return "pill-versao";
  return "pill-sem";
}

async function openPortfolioView(){
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("breadcrumb").textContent = plPrefixo() + "Portfólio";
  document.getElementById("meta-bar").innerHTML = `<span class="badge badge-type">portfólio</span><span id="meta-path">tudo que roda, por projeto · links, launchers, protótipos, docs</span>`;
  const content = document.getElementById("content");
  content.classList.add("pf-wide");
  content.innerHTML = `<p class="dash-lead">Carregando portfólio…</p>`;
  try{
    const r = await fetch("/api/portfolio");
    PF = await r.json();
  } catch(err){
    content.innerHTML = `<p class="dash-lead">Falha ao carregar: ${escapeHtml(String(err))}</p>`;
    return;
  }
  drawPortfolio();
}

function pfProjetoPassa(p){
  const f = PF_FILTRO;
  if (f.tipo && p.tipo !== f.tipo) return false;
  if (f.status && pfStatusClass(p.status) !== f.status) return false;
  if (f.kind === "no-ar" && !p.contagens.no_ar) return false;
  if (f.kind === "local" && !p.contagens.roda_local) return false;
  if (f.kind === "prototipo" && !p.contagens.prototipos) return false;
  if (f.kind === "docs" && !p.contagens.docs) return false;
  if (f.kind === "nada" && (p.contagens.no_ar || p.contagens.roda_local || p.contagens.prototipos || p.contagens.docs)) return false;
  if (f.q){
    const ql = f.q.toLowerCase();
    const alvo = [p.pasta, p.nome, p.resumo, (p.tags||[]).join(" "), p.execs.map(e => e.nome).join(" ")].join(" ").toLowerCase();
    if (!alvo.includes(ql)) return false;
  }
  return true;
}

function pfChip(label, ativo, onclick, title){
  const c = document.createElement("div");
  c.className = "chip" + (ativo ? " active" : "");
  c.textContent = label;
  if (title) c.title = title;
  c.onclick = onclick;
  return c;
}

function drawPortfolio(){
  const content = document.getElementById("content");
  content.innerHTML = "";
  const t = PF.totais;
  const head = document.createElement("div");
  head.className = "pf-head";
  head.innerHTML = `<div><h1>Portfólio</h1><p class="dash-lead" style="margin:4px 0 0">Gerado ${escapeHtml(PF.gerado_em.replace("T"," "))} · curadoria por <code>portfolio.json</code> em cada projeto</p></div>`;
  const kpis = document.createElement("div");
  kpis.className = "pf-kpis";
  [[t.projetos, plNome(plUltimo(), true).toLowerCase() || "projetos"], [t.no_ar, "no ar"], [t.roda_local, "rodam local"], [t.prototipos, "protótipos"], [t.docs, "docs & design"], [t.com_repo, "com repo"]]
    .forEach(([n, l]) => { const k = document.createElement("div"); k.className = "pf-kpi"; k.innerHTML = `<div class="n">${n}</div><div class="l">${l}</div>`; kpis.appendChild(k); });
  head.appendChild(kpis);
  content.appendChild(head);
  const nota = document.createElement("p");
  nota.className = "pf-static-note";
  nota.textContent = "Snapshot estático: links \"no ar\" e repositórios funcionam; abrir protótipos e launchers só na Estação local.";
  content.appendChild(nota);

  const filtros = document.createElement("div");
  filtros.className = "pf-filtros";
  const busca = document.createElement("input");
  busca.placeholder = "filtrar por nome, resumo, tag, arquivo…";
  busca.value = PF_FILTRO.q;
  busca.oninput = () => { PF_FILTRO.q = busca.value.trim(); drawPortfolioGrid(); };
  filtros.appendChild(busca);
  filtros.appendChild(Object.assign(document.createElement("div"), {className: "sep"}));
  [["no-ar", "no ar"], ["local", "roda local"], ["prototipo", "tem protótipo"], ["docs", "tem docs"], ["nada", "sem nada ainda"]]
    .forEach(([k, l]) => filtros.appendChild(pfChip(l, PF_FILTRO.kind === k, () => { PF_FILTRO.kind = PF_FILTRO.kind === k ? null : k; drawPortfolio(); })));
  filtros.appendChild(Object.assign(document.createElement("div"), {className: "sep"}));
  const tipos = [...new Set(PF.projetos.map(p => p.tipo))].filter(x => x && x !== "—").sort();
  tipos.forEach(tp => filtros.appendChild(pfChip(tp, PF_FILTRO.tipo === tp, () => { PF_FILTRO.tipo = PF_FILTRO.tipo === tp ? null : tp; drawPortfolio(); },
    {DIG: "digital", DAD: "dados", CON: "consultoria", ADE: "adestramento/ensino"}[tp] || tp)));
  filtros.appendChild(Object.assign(document.createElement("div"), {className: "sep"}));
  [["pill-ativo", "ativo"], ["pill-idea", "idea-stage"], ["pill-early", "early-stage"], ["pill-versao", "versionado"]]
    .forEach(([k, l]) => filtros.appendChild(pfChip(l, PF_FILTRO.status === k, () => { PF_FILTRO.status = PF_FILTRO.status === k ? null : k; drawPortfolio(); })));
  filtros.appendChild(Object.assign(document.createElement("div"), {className: "sep"}));
  filtros.appendChild(pfChip("mostrar rascunhos", PF_FILTRO.mostrarRascunho, () => { PF_FILTRO.mostrarRascunho = !PF_FILTRO.mostrarRascunho; drawPortfolio(); }, "cópias, versões antigas, relatórios de teste"));
  content.appendChild(filtros);

  const grid = document.createElement("div");
  grid.className = "pf-grid";
  grid.id = "pf-grid";
  content.appendChild(grid);
  drawPortfolioGrid();
  busca.focus();
}

function pfLinkArquivo(e){
  const local = ["launcher", "binario", "servidor"].includes(e.kind);
  const el = document.createElement(local ? "button" : "a");
  el.className = "pf-link pf-local" + (local ? " run" : "") + (e.destaque ? " destaque" : "") + (e.estagio === "rascunho" ? " rascunho" : "");
  const grp = e.grupo && e.grupo !== "raiz" ? `<span class="grp">${escapeHtml(e.grupo)}/</span>` : "";
  const est = e.estagio && e.estagio !== "prototipo" ? `<span class="pill pill-${e.estagio}">${e.estagio === "estavel" ? "estável" : e.estagio}</span>` : "";
  el.innerHTML = `${local ? "▶ " : ""}${grp}<span class="nm" title="${escapeHtml(e.path)}">${escapeHtml(e.nome)}</span>${est}`;
  el.title = `${PF_KIND_LABEL[e.kind] || e.kind} · ${e.path} · ${e.mtime}`;
  if (local){
    el.onclick = () => pfLaunch(e);
  } else {
    el.href = "/files/" + e.path.split("/").map(encodeURIComponent).join("/");
    el.target = "_blank";
    el.rel = "noopener";
  }
  return el;
}

async function pfLaunch(e){
  if (!confirm(`Abrir agora, nesta máquina?\n\n${e.path}\n\nIsso executa o arquivo numa janela própria.`)) return;
  try{
    const r = await fetch("/api/launch", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path: e.path})});
    const d = await r.json();
    if (!r.ok){ toast("Não abriu: " + (d.error || r.status)); return; }
    toast("Iniciado: " + e.nome);
  } catch(err){ toast("Falha: " + err); }
}

function pfSecao(container, titulo, itens, key, limite){
  if (!itens.length) return;
  const sec = document.createElement("div");
  sec.className = "pf-sec";
  const aberto = PF_ABERTOS.has(key);
  const visiveis = aberto ? itens : itens.slice(0, limite);
  sec.innerHTML = `<div class="pf-sec-t">${escapeHtml(titulo)} <span class="cnt">${itens.length}</span></div>`;
  const wrap = document.createElement("div");
  wrap.className = "pf-links";
  visiveis.forEach(e => wrap.appendChild(pfLinkArquivo(e)));
  sec.appendChild(wrap);
  if (itens.length > limite){
    const b = document.createElement("button");
    b.className = "pf-mais";
    b.textContent = aberto ? "mostrar menos" : `+ ${itens.length - limite} mais…`;
    b.onclick = () => { aberto ? PF_ABERTOS.delete(key) : PF_ABERTOS.add(key); drawPortfolioGrid(); };
    sec.appendChild(b);
  }
  container.appendChild(sec);
}

function drawPortfolioGrid(){
  const grid = document.getElementById("pf-grid");
  if (!grid) return;
  grid.innerHTML = "";
  const projetos = PF.projetos.filter(pfProjetoPassa).sort((a, b) => a.ordem - b.ordem || a.pasta.localeCompare(b.pasta));
  if (!projetos.length){
    grid.innerHTML = `<p class="pf-vazio-msg">Nenhum projeto bate com esse filtro.</p>`;
    return;
  }
  projetos.forEach(p => {
    const execs = p.execs.filter(e => PF_FILTRO.mostrarRascunho || e.estagio !== "rascunho");
    const nada = !p.links.length && !execs.length;
    const card = document.createElement("div");
    card.className = "pf-card" + (nada ? " vazio" : "");
    const pills = [`<span class="pill pill-tipo">${escapeHtml(p.tipo)}</span>`, `<span class="pill ${pfStatusClass(p.status)}">${escapeHtml(p.status)}</span>`];
    if (!p.listada) pills.push(`<span class="pill pill-sem" title="a pasta não está no índice canônico de projetos da plataforma">fora do índice</span>`);
    card.innerHTML = `<div class="pf-card-top"><h2>${escapeHtml(p.nome)}<small>${escapeHtml(p.pasta)}</small></h2><div class="pf-pills">${pills.join("")}</div></div>`;
    if (p.resumo){ const r = document.createElement("p"); r.className = "pf-resumo"; r.title = p.resumo; r.textContent = p.resumo; card.appendChild(r); }
    if (p.nota){ const n = document.createElement("p"); n.className = "pf-nota"; n.textContent = p.nota; card.appendChild(n); }
    const g = p.git || {};
    const gitEl = document.createElement("div");
    gitEl.className = "pf-git";
    gitEl.innerHTML = (g.ultimo_commit ? `<span>último commit ${escapeHtml(g.ultimo_commit)}</span><span>${g.commits} commit${g.commits === 1 ? "" : "s"}</span>` : `<span>sem git</span>`)
      + (p.tags && p.tags.length ? `<span>${p.tags.map(t => "#" + escapeHtml(t)).join(" ")}</span>` : "");
    card.appendChild(gitEl);

    // links externos: no ar + repositório
    if (p.links.length){
      const sec = document.createElement("div");
      sec.className = "pf-sec";
      sec.innerHTML = `<div class="pf-sec-t">Na internet</div>`;
      const wrap = document.createElement("div");
      wrap.className = "pf-links";
      p.links.forEach(l => {
        const a = document.createElement("a");
        a.className = "pf-link" + (l.kind === "no-ar" ? " noar" : "");
        a.href = l.url; a.target = "_blank"; a.rel = "noopener";
        const host = l.url.replace(/^https?:\/\//, "").split("/")[0];
        a.innerHTML = `${l.kind === "no-ar" ? "🌐 " : "⌥ "}<span class="nm">${escapeHtml(l.label)} · ${escapeHtml(host)}</span>`;
        a.title = l.url;
        wrap.appendChild(a);
      });
      sec.appendChild(wrap);
      card.appendChild(sec);
    }
    pfSecao(card, "Rodar aqui", execs.filter(e => ["launcher", "binario", "servidor"].includes(e.kind)), p.pasta + ":run", 4);
    pfSecao(card, "Protótipos e builds", execs.filter(e => ["prototipo", "build"].includes(e.kind)), p.pasta + ":prot", 4);
    pfSecao(card, "Docs e design", execs.filter(e => ["doc", "design"].includes(e.kind)), p.pasta + ":doc", 3);
    if (nada){
      const v = document.createElement("p"); v.className = "pf-vazio-msg";
      v.textContent = p.tem_claude ? "Nada executável ainda — só o índice e o backlog." : "Sem CLAUDE.md — a pasta ainda não é um projeto completo.";
      card.appendChild(v);
    }
    const foot = document.createElement("div");
    foot.className = "pf-foot";
    foot.innerHTML = `<a data-abrir-projeto>abrir projeto →</a><a data-open="${escapeHtml(p.pasta)}/CLAUDE.md">orquestra (CLAUDE.md)</a><span>${p.contagens.rascunhos ? p.contagens.rascunhos + " rascunho(s) oculto(s)" : ""}</span>`;
    foot.querySelector("[data-abrir-projeto]").onclick = () => openProjetoView(p.pasta);
    foot.querySelector("[data-open]").onclick = () => tryOpenTarget(p.pasta + "/CLAUDE.md");
    card.appendChild(foot);
    grid.appendChild(card);
  });
}
