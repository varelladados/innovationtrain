async function openDashboardView(){
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  document.getElementById("breadcrumb").textContent = plPrefixo() + "Dashboard";
  document.getElementById("meta-bar").innerHTML = `<span class="badge badge-type">dashboard</span>`;
  const content = document.getElementById("content");
  content.innerHTML = `<p class="dash-lead">Carregando métricas…</p>`;

  let data;
  try{
    const r = await fetch("/api/metricas");
    data = await r.json();
  } catch(err){
    content.innerHTML = `<p class="dash-lead">Falha ao carregar métricas: ${escapeHtml(String(err))}</p>`;
    return;
  }

  const fmt = n => (n === null || n === undefined) ? "—" : n.toLocaleString("pt-BR");
  content.innerHTML = "";

  const header = document.createElement("div");
  header.innerHTML = `<h1>Dashboard</h1><p class="dash-lead">${escapeHtml(PLAT ? PLAT.nome : "")} · gerado em ${escapeHtml(data.gerado_em.replace("T"," "))} — recalculado a cada carregamento a partir do registro e do disco.</p>`;
  content.appendChild(header);

  // KPIs
  const ultimo = plUltimo();
  const kpis = [
    {num: data.log.total_linhas_log, label: "Linhas no registro"},
  ];
  // um cartão por estágio, com o nome que a plataforma declara: "quantos ainda
  // não avançaram daqui". O último estágio não avança pra lugar nenhum — dele o
  // que interessa é o total.
  plEstagios().forEach((e, i) => {
    const n = i + 1;
    kpis.push(n < ultimo
      ? {num: (data.log.sem_destino_por_etapa || {})[e.sigla] || 0,
         label: `${e.plural || e.nome} sem destino`}
      : {num: (data.log.por_etapa || {})[e.sigla] || 0,
         label: `${e.plural || e.nome} no registro`});
  });
  kpis.push(
    {num: data.arquivos.total_arquivos, label: "Arquivos na plataforma"},
    {num: data.arquivos.total_md, label: "Arquivos .md"},
    {num: data.arquivos.linhas_codigo, label: "Linhas de código"});
  // só aparece quanda plataforma de origem declara um campo de núcleo; o rótulo é o
  // nome que ELA dá ao campo, não um escrito aqui.
  if (data.nucleo && data.nucleo.marcados_nucleo !== undefined){
    kpis.push({num: data.nucleo.marcados_nucleo,
               label: `Marcados ${data.nucleo.campo_nucleo}`});
  }
  const kpiSection = document.createElement("div");
  kpiSection.className = "dash-section";
  kpiSection.innerHTML = "<h2>Visão geral</h2>";
  const kpiGrid = document.createElement("div");
  kpiGrid.className = "dash-kpi-grid";
  kpis.forEach(k => {
    const card = document.createElement("div");
    card.className = "dash-kpi-card";
    card.innerHTML = `<div class="num">${fmt(k.num)}</div><div class="label">${escapeHtml(k.label)}</div>`;
    kpiGrid.appendChild(card);
  });
  kpiSection.appendChild(kpiGrid);
  content.appendChild(kpiSection);

  // Distribuição por etapa
  const etapaSection = document.createElement("div");
  etapaSection.className = "dash-section";
  etapaSection.innerHTML = "<h2>Distribuição por etapa</h2>";
  const ordemEtapa = plEstagios().map(e => e.sigla);
  const maxEtapa = Math.max(...ordemEtapa.map(e => data.log.por_etapa[e] || 0), 1);
  ordemEtapa.forEach(etapa => {
    const v = data.log.por_etapa[etapa] || 0;
    const pct = Math.round((v / maxEtapa) * 100);
    const row = document.createElement("div");
    row.className = "dash-bar-row";
    row.innerHTML = `<div class="rotulo">${etapa}</div><div class="dash-bar-track"><div class="dash-bar-fill" style="width:${pct}%"></div></div><div class="valor">${fmt(v)}</div>`;
    etapaSection.appendChild(row);
  });
  content.appendChild(etapaSection);

  // Distribuição por tipo
  const significados = {DIG: "Digital (app/site/ferramenta)", DAD: "Dados/análise", CON: "Consultoria/processo", ADE: "Aprendizado/educação"};
  const tipoSection = document.createElement("div");
  tipoSection.className = "dash-section";
  let tipoRows = Object.keys(data.log.por_tipo).sort().map(t =>
    `<tr><td>${t}</td><td>${significados[t]||"—"}</td><td>${fmt(data.log.por_tipo[t])}</td></tr>`
  ).join("");
  tipoSection.innerHTML = `<h2>Distribuição por tipo de projeto</h2><table><thead><tr><th>Tipo</th><th>Significado</th><th>Contagem</th></tr></thead><tbody>${tipoRows}</tbody></table>`;
  content.appendChild(tipoSection);

  // Notas/ideias por dia
  const diaSection = document.createElement("div");
  diaSection.className = "dash-section";
  diaSection.innerHTML = "<h2>Notas e ideias por dia</h2>";
  const dias = Object.keys(data.log.por_dia).sort();
  const maxDia = Math.max(...dias.map(d => data.log.por_dia[d]), 1);
  const chart = document.createElement("div");
  chart.className = "dash-chart-vert";
  dias.forEach(d => {
    const v = data.log.por_dia[d];
    const alturaPx = Math.max(4, Math.round((v / maxDia) * 120));
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `<div class="val">${v}</div><div class="bar" style="height:${alturaPx}px"></div><div class="dia">${escapeHtml(d.slice(5).replace("-","/"))}</div>`;
    chart.appendChild(col);
  });
  diaSection.appendChild(chart);
  content.appendChild(diaSection);

  // Esforço
  const esforcoSection = document.createElement("div");
  esforcoSection.className = "dash-section";
  esforcoSection.innerHTML = `<h2>Esforço: hora-homem vs. hora-máquina</h2><div class="dash-esforco"><strong>Sem fonte de dado hoje.</strong> ${escapeHtml(data.esforco.nota)}</div>`;
  content.appendChild(esforcoSection);
}

// ============================================================
// Workflow — os estágios da plataforma + decisões abertas (GET /api/workflow, /api/avanco)
// ============================================================
// v1: só leitura. Resolver uma pendência continua sendo uma sessão do Claude
// Code. Decisão inline dentro do card ficou para depois, de propósito.
// os rótulos e a ordem das colunas vêm do servidor: dependem da taxonomia da
// plataforma ativa, e não são mais uma lista fixa escrita aqui.
let WF_STAGE_LABEL = {};

async function openWorkflowView(){
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  document.getElementById("breadcrumb").textContent = plPrefixo() + "Workflow";
  document.getElementById("meta-bar").innerHTML = `<span class="badge badge-type">workflow</span><span id="meta-path">${escapeHtml(plCadeia())} + decisões abertas — responda aqui, a próxima rodada encaminha</span>`;
  const content = document.getElementById("content");
  content.innerHTML = `<p class="dash-lead">Carregando workflow…</p>`;

  let data, av;
  try{
    [data, av] = await Promise.all([
      fetch("/api/workflow").then(r => r.json()),
      fetch("/api/avanco").then(r => r.json()),
    ]);
  } catch(err){
    content.innerHTML = `<p class="dash-lead">Falha ao carregar: ${escapeHtml(String(err))}</p>`;
    return;
  }
  content.innerHTML = "";

  const header = document.createElement("div");
  const nomes = plEstagios().map(e => (e.plural || e.nome).toLowerCase()).join(" → ");
  header.innerHTML = `<h1>Workflow</h1><p class="dash-lead">O que ainda está em trânsito entre ${escapeHtml(nomes)}, e as decisões que só você resolve.</p>`;
  content.appendChild(header);

  if (av && !av.erro){
    const box = document.createElement("div");
    box.className = "wf-avanco";
    box.innerHTML = `<p class="tit">Última rodada — ${escapeHtml(av.titulo)}</p><p class="ctx">${escapeHtml(av.resumo || "")}</p>`;
    if (av.path){
      const a = document.createElement("a");
      a.href = "#"; a.style.fontSize = "12px"; a.textContent = "ver histórico completo →";
      a.onclick = (ev) => { ev.preventDefault(); openFile(av.path); };
      box.appendChild(a);
    }
    content.appendChild(box);
  }

  // Pendências primeiro: é a parte acionável. O kanban (panorama, centenas de
  // cards) vem depois — antes ele empurrava a decisão pra fora da primeira tela.
  WF_CARDS = (data.pendencias && data.pendencias.cards) || [];
  WF_ERRO_PEND = (data.pendencias && data.pendencias.erro) || null;

  const pendHeader = document.createElement("h2");
  pendHeader.style.cssText = "font-family:'Fraunces',serif;font-weight:600;font-size:18px;border-bottom:2px solid var(--accent);padding-bottom:8px";
  pendHeader.id = "wf-pend-header";
  content.appendChild(pendHeader);

  const filtros = document.createElement("div");
  filtros.className = "wf-filtros";
  filtros.id = "wf-filtros";
  content.appendChild(filtros);

  const lista = document.createElement("div");
  lista.id = "wf-lista";
  content.appendChild(lista);

  const boardHeader = document.createElement("h2");
  boardHeader.style.cssText = "font-family:'Fraunces',serif;font-weight:600;font-size:18px;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-top:34px";
  boardHeader.textContent = "Pipeline";
  content.appendChild(boardHeader);

  const board = document.createElement("div");
  board.className = "wf-board";
  WF_STAGE_LABEL = data.rotulos || {};
  Object.keys(WF_STAGE_LABEL).forEach(stage => {
    const col = document.createElement("div");
    col.className = "wf-col";
    const itens = (data.colunas && data.colunas[stage]) || [];
    col.innerHTML = `<h3>${WF_STAGE_LABEL[stage]} <span class="cnt">${itens.length}</span></h3>`;
    if (!itens.length){
      col.innerHTML += `<div class="wf-empty">vazio</div>`;
    } else {
      itens.slice(0, WF_KANBAN_MAX).forEach(it => {
        const card = document.createElement("div");
        // est-N pinta a borda e a sigla com a escala de maturidade
        card.className = "wf-card" + (it.estagio ? " est-" + it.estagio : "");
        card.innerHTML = `<span class="et">${escapeHtml(it.etapa || "—")}</span><span class="ti">${escapeHtml(it.title || it.path.split("/").pop())}</span>`;
        card.title = it.path;
        card.onclick = () => openFile(it.path);
        col.appendChild(card);
      });
      if (itens.length > WF_KANBAN_MAX){
        const mais = document.createElement("div");
        mais.className = "wf-empty";
        mais.textContent = `+ ${itens.length - WF_KANBAN_MAX} mais (use a árvore/busca)`;
        col.appendChild(mais);
      }
    }
    board.appendChild(col);
  });
  content.appendChild(board);

  drawPendencias();
}

const WF_KANBAN_MAX = 12;  // panorama, não lista completa — a árvore/busca cobre o resto

// Estado da lista de pendências (a view redesenha só esta parte após cada resposta)
let WF_CARDS = [];
let WF_ERRO_PEND = null;
let WF_FILTRO = "todas";  // todas | aberta | respondida

const WF_ESTADO_LABEL = {
  "aberta": "aberta",
  "respondida": "respondida — aguardando avanço",
  "adiada-marcada": "adiada — volta priorizada",
  "nao-parseavel": "formato não reconhecido",
};

function wfPassa(c){
  if (WF_FILTRO === "todas") return true;
  if (WF_FILTRO === "aberta") return c.estado === "aberta" || c.estado === "nao-parseavel";
  if (WF_FILTRO === "respondida") return c.estado === "respondida" || c.estado === "adiada-marcada";
  return true;
}

function drawPendencias(){
  const lista = document.getElementById("wf-lista");
  if (!lista) return;
  const visiveis = WF_CARDS.filter(wfPassa);

  const header = document.getElementById("wf-pend-header");
  const respondidas = WF_CARDS.filter(c => c.estado === "respondida").length;
  header.textContent = `Pendências ativas (${WF_CARDS.length})`
    + (respondidas ? ` · ${respondidas} aguardando o avanço` : "");

  const filtros = document.getElementById("wf-filtros");
  filtros.innerHTML = "";
  [["todas", "todas"], ["aberta", "só abertas"], ["respondida", "já respondidas"]].forEach(([k, l]) => {
    const chip = document.createElement("div");
    chip.className = "chip" + (WF_FILTRO === k ? " active" : "");
    chip.textContent = l;
    chip.onclick = () => { WF_FILTRO = k; drawPendencias(); };
    filtros.appendChild(chip);
  });

  const brf = document.createElement("button");
  brf.className = "brf-btn";
  brf.style.marginLeft = "auto";
  brf.textContent = respondidas
    ? `Briefing pra IA (${respondidas} respondida${respondidas > 1 ? "s" : ""}) →`
    : "Briefing pra IA →";
  brf.disabled = !respondidas;
  brf.title = respondidas
    ? "Gera o texto pra colar numa sessão do Claude Code encaminhar as respondidas"
    : "Responda alguma pendência primeiro";
  brf.onclick = () => abrirBriefing("pendencias");
  filtros.appendChild(brf);

  lista.innerHTML = "";
  if (WF_ERRO_PEND){
    const err = document.createElement("p");
    err.className = "dash-lead";
    err.textContent = "Pendências indisponíveis: " + WF_ERRO_PEND;
    lista.appendChild(err);
  }
  if (!visiveis.length){
    const p = document.createElement("p");
    p.className = "wf-empty";
    p.textContent = WF_CARDS.length ? "Nenhuma pendência neste filtro." : "Nenhuma pendência ativa no momento.";
    lista.appendChild(p);
    return;
  }
  visiveis.forEach(c => lista.appendChild(wfCard(c)));
}

function wfCard(c){
  const box = document.createElement("div");
  box.className = "wf-pend " + c.estado;

  const badges = [`<span class="wf-b wf-b-${c.categoria === "Incremento" ? "incremento" : "sustentacao"}">${escapeHtml(c.categoria)}</span>`,
                  `<span class="wf-b wf-b-${c.estado}">${WF_ESTADO_LABEL[c.estado] || c.estado}</span>`];
  if (c.essencial) badges.push(`<span class="wf-b wf-b-essencial">essencial</span>`);
  if (c.adiada) badges.push(`<span class="wf-b wf-b-adiada">adiada ${c.adiada}x</span>`);

  box.innerHTML = `<div class="wf-badges">${badges.join("")}</div>
    <p class="tit">${escapeHtml(c.title)}</p>
    ${c.contexto ? `<p class="ctx">${escapeHtml(c.contexto)}</p>` : ""}`;

  if (!c.parse_ok){
    const aviso = document.createElement("p");
    aviso.className = "ctx";
    aviso.textContent = "Este arquivo não tem um bloco de resposta que eu saiba ler — responda abrindo o arquivo.";
    box.appendChild(aviso);
    if (c.raw){
      const pre = document.createElement("pre");
      pre.className = "wf-raw";
      pre.textContent = c.raw;
      box.appendChild(pre);
    }
  }

  (c.perguntas || []).forEach(perg => {
    const bloco = document.createElement("div");
    bloco.className = "wf-perg";
    if (perg.texto || perg.titulo !== "Resposta"){
      const t = document.createElement("p");
      t.className = "wf-perg-t";
      t.textContent = perg.texto || perg.titulo;
      bloco.appendChild(t);
    }
    perg.opcoes.forEach(op => bloco.appendChild(wfOpcao(c, op)));
    box.appendChild(bloco);
  });

  const meta = document.createElement("div");
  meta.className = "meta";
  const partes = [];
  if (c.revisar_quando) partes.push(`revisar quando: ${escapeHtml(c.revisar_quando)}`);
  if (c.fonte) partes.push(`fonte: ${escapeHtml(c.fonte)}`);
  meta.innerHTML = partes.join(" · ");
  const abrir = document.createElement("a");
  abrir.href = "#";
  abrir.textContent = "abrir arquivo →";
  abrir.onclick = (ev) => { ev.preventDefault(); openFile(c.path); };
  meta.appendChild(abrir);
  box.appendChild(meta);
  return box;
}

function wfOpcao(card, op){
  if (op.kind === "outra"){
    const wrap = document.createElement("div");
    const label = document.createElement("div");
    label.className = "wf-opt" + (op.marcado ? " marcada" : "");
    label.innerHTML = `<span class="lb">Outra resposta</span>${op.texto_livre ? `<span class="rz">— ${escapeHtml(op.texto_livre)}</span>` : ""}`;
    wrap.appendChild(label);
    const linha = document.createElement("div");
    linha.className = "wf-outra";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "responder com suas palavras…";
    input.value = op.texto_livre || "";
    input.maxLength = 600;
    const btn = document.createElement("button");
    btn.textContent = "Gravar";
    const enviar = () => {
      const txt = input.value.trim();
      if (!txt){ toast("Escreva a resposta antes de gravar"); input.focus(); return; }
      wfResponder(card, op, "outra", txt);
    };
    btn.onclick = enviar;
    input.onkeydown = (ev) => { if (ev.key === "Enter") enviar(); };
    linha.appendChild(input);
    linha.appendChild(btn);
    wrap.appendChild(linha);
    return wrap;
  }

  const el = document.createElement("label");
  el.className = "wf-opt" + (op.marcado ? " marcada" : "");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = op.marcado;
  cb.onchange = () => wfResponder(card, op, op.marcado ? "desmarcar" : "marcar");
  el.appendChild(cb);
  const txt = document.createElement("span");
  txt.innerHTML = `<span class="lb">${escapeHtml(op.label)}</span>${op.reason ? ` <span class="rz">— ${escapeHtml(op.reason)}</span>` : ""}`;
  el.appendChild(txt);
  return el;
}

async function wfResponder(card, op, acao, texto){
  try{
    const r = await fetch("/api/pendencia/responder", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ref: card.ref, line_number: op.line_number, expected_text: op.text, acao, texto: texto || ""}),
    });
    const data = await r.json();
    if (!r.ok){
      if (r.status === 409){
        toast("O arquivo mudou por fora — recarregando");
        await recarregarPendencias();
        return;
      }
      toast("Erro: " + (data.error || r.status));
      await recarregarPendencias();
      return;
    }
    const i = WF_CARDS.findIndex(c => c.ref === card.ref);
    if (i >= 0) WF_CARDS[i] = data.card;
    drawPendencias();
    toast(data.estado === "respondida" ? "Respondida — o avanço encaminha na próxima rodada" : "Gravado");
  } catch(err){
    toast("Falha de rede: " + err);
  }
}

async function recarregarPendencias(){
  try{
    const r = await fetch("/api/workflow");
    const data = await r.json();
    WF_CARDS = (data.pendencias && data.pendencias.cards) || [];
    WF_ERRO_PEND = (data.pendencias && data.pendencias.erro) || null;
    drawPendencias();
  } catch(err){ toast("Falha ao recarregar: " + err); }
}

// ============================================================
// Briefing pra IA — a ponte do console pra sessão do Claude Code / Codex
// ============================================================
// O app não tem IA dentro: ele prepara o texto com os caminhos reais e os
// guardrails do método, e o humano cola na sessão. Ver app/briefing.py.
// O modal do prompt serve a dois donos: o briefing (que precisa de uma
// plataforma pronta) e o Embarque (que existe justamente porque ela não
// existe). Título e subtítulo eram hardcoded no HTML e o fetch estava embutido
// no abrirBriefing — extraídos daqui para que o segundo dono não precise de uma
// segunda cópia do modal.
function mostrarPrompt(texto, opcoes){
  const o = opcoes || {};
  document.getElementById("brf-titulo").textContent = o.titulo || "Briefing pra IA";
  document.getElementById("brf-sub-cwd").innerHTML = o.sub ||
    "Cole numa sessão do Claude Code / Codex, com o <code>cwd</code> na pasta da plataforma. Os guardrails do método já vão junto.";
  const ta = document.getElementById("brf-texto");
  ta.value = texto;
  document.getElementById("brf-overlay").classList.add("open");
  ta.scrollTop = 0;
}

async function abrirBriefing(tipo, params){
  const qs = new URLSearchParams(Object.assign({tipo}, params || {}));
  try{
    const r = await fetch("/api/briefing?" + qs.toString());
    const data = await r.json();
    if (!r.ok){ toast("Erro: " + (data.error || r.status)); return; }
    mostrarPrompt(data.texto);
  } catch(err){ toast("Falha ao gerar briefing: " + err); }
}

function fecharBriefing(){
  document.getElementById("brf-overlay").classList.remove("open");
}

async function copiarBriefing(){
  const ta = document.getElementById("brf-texto");
  try{
    await navigator.clipboard.writeText(ta.value);
    toast("Briefing copiado — cole na sessão do Claude Code");
  } catch(err){
    ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy");
    ta.setAttribute("readonly", "");
    toast("Briefing copiado");
  }
}

// ============================================================
// Versões — o que está salvo e o que não está (GET /api/versoes)
// ============================================================
// NÃO é um cliente de git: é um painel de respostas a quatro perguntas, nesta
// ordem de importância. Se o automatismo do commit está funcionando, esta aba
// quase sempre mostra tudo verde — e é exatamente esse o valor dela: dar a ver
// que a rede está lá.
//
// Tudo aqui é FOTO DO MOMENTO DA CONSULTA. A automação do usuário commita, o
// editor mexe, outra sessão salva: o estado pode ter mudado entre a consulta e
// a leitura. Por isso a hora fica visível e existe um botão de atualizar.
async function openVersoesView(){
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  document.getElementById("breadcrumb").textContent = plPrefixo() + "Versões";
  document.getElementById("meta-bar").innerHTML =
    `<span class="badge badge-type">versões</span><span id="meta-path">foto do momento da consulta — a Estação lê o git, nunca o executa</span>`;
  const content = document.getElementById("content");
  content.innerHTML = `<h1>Versões</h1><p class="dash-lead">Carregando…</p>`;

  let dados;
  try {
    dados = await (await fetch("/api/versoes")).json();
  } catch(e){
    content.innerHTML = `<h1>Versões</h1><p class="dash-lead">Não consegui ler o estado: ${escapeHtml(String(e))}</p>`;
    return;
  }

  content.innerHTML = `<h1>Versões</h1>
    <p class="dash-lead">O que está guardado, o que ainda não está, e o que ainda não saiu do seu computador.</p>`;

  const foto = document.createElement("p");
  foto.className = "vs-foto";
  const quando = (dados.repositorios[0] || {}).consultado_em || "";
  foto.innerHTML = `<span>Foto de <strong>${escapeHtml(quando)}</strong> — pode ter mudado desde então.</span>`;
  const atualizar = document.createElement("button");
  atualizar.className = "brf-btn";
  atualizar.textContent = "↻ atualizar";
  atualizar.onclick = openVersoesView;
  foto.appendChild(atualizar);
  content.appendChild(foto);

  content.appendChild(vsRede(dados.backups, dados.repositorios));
  dados.repositorios.forEach(r => content.appendChild(vsRepo(r)));
}

// As três camadas nomeadas, porque proteção invisível não tranquiliza ninguém.
function vsRede(backups, repos){
  const el = document.createElement("div");
  el.className = "vs-rede";
  const comRemoto = repos.filter(r => r.tem_remoto).length;
  const salvos = repos.filter(r => r.e_repo).length;
  el.innerHTML = `<h2>A rede de proteção</h2>
    <div class="vs-camada"><span class="nome">1. Backup automático</span>
      <span class="desc">A Estação copia o arquivo antes de toda escrita.
        ${backups.quantos ? `<strong>${backups.quantos} cópia(s)</strong> guardadas${backups.desde ? `, desde ${escapeHtml(backups.desde)}` : ""}.`
                          : "Nenhuma cópia ainda — ela nasce na primeira vez que o app escreve."}
        Protege do erro <em>de agora</em>.</span></div>
    <div class="vs-camada"><span class="nome">2. Ponto salvo</span>
      <span class="desc">O commit. <strong>${salvos} de ${repos.length}</strong> repositório(s) versionados.
        Protege do erro <em>de ontem</em>.</span></div>
    <div class="vs-camada"><span class="nome">3. Cópia na nuvem</span>
      <span class="desc">O remoto. <strong>${comRemoto} de ${repos.length}</strong> com cópia fora daqui.
        Protege do computador que <em>morreu</em>.</span></div>
    <p class="desc" style="margin:var(--sp-2) 0 0;font-size:var(--fs-1);color:var(--text-2)">
      Uma não substitui a outra.</p>`;
  return el;
}

function vsResposta(cor, pergunta, valor, obs){
  return `<div class="vs-resposta ${cor}">
    <p class="pergunta">${pergunta}</p>
    <p class="valor">${valor}</p>
    ${obs ? `<p class="obs">${obs}</p>` : ""}</div>`;
}

function vsRepo(r){
  const el = document.createElement("div");
  el.className = "vs-repo";
  const s = r.semaforo || {cor: "cinza", titulo: "—", texto: ""};
  el.innerHTML = `<h2><span class="vs-sinal ${s.cor}"></span>${escapeHtml(r.rotulo)}</h2>
    <p class="caminho">${escapeHtml(r.pasta)}</p>`;

  if (!r.e_repo){
    el.innerHTML += vsResposta("cinza", "Esta pasta está sendo versionada?",
      "Não", escapeHtml(r.erro || "") +
      " — o que está aqui não tem ponto salvo nenhum. Uma sessão de IA cria o repositório num comando, quando você quiser.");
    return el;
  }

  // 1. a pergunta que importa
  let lista = "";
  if (r.sujos.length){
    lista = `<ul class="vs-arquivos">` + r.sujos.slice(0, 12).map(a =>
      `<li><span class="marca">${escapeHtml(a.estado.trim() || "·")}</span> ${escapeHtml(a.caminho)} <span style="opacity:.7">— ${escapeHtml(a.rotulo)}</span></li>`).join("") +
      (r.sujos.length > 12 ? `<li>… e mais ${r.sujos.length - 12}</li>` : "") + `</ul>`;
  }
  el.innerHTML += vsResposta(s.cor, "Tem trabalho meu que ainda não está salvo em lugar nenhum?",
    escapeHtml(s.titulo), escapeHtml(s.texto)) + lista;

  // 2. quando foi a última vez
  const u = r.ultimo;
  el.innerHTML += vsResposta(u ? "verde" : "ambar", "Quando foi a última vez que salvei?",
    u ? escapeHtml(u.ha_quanto || u.data) : "Nunca",
    u ? escapeHtml(u.mensagem) : "Este repositório ainda não tem nenhum ponto salvo.");

  // 3. o que não subiu
  let corNuvem = "verde", valorNuvem, obsNuvem;
  if (!r.tem_remoto){
    corNuvem = "ambar"; valorNuvem = "Não há cópia na nuvem";
    obsNuvem = "Este repositório não tem remoto configurado. Se o computador morrer, o histórico morre junto.";
  } else if (r.nao_enviados === null){
    corNuvem = "ambar"; valorNuvem = "Nada foi enviado ainda";
    obsNuvem = "Existe um remoto, mas esta linha de trabalho ainda não tem par lá.";
  } else if (r.nao_enviados > 0){
    corNuvem = "ambar"; valorNuvem = `${r.nao_enviados} ponto(s) salvo(s) só aqui`;
    obsNuvem = "Estão guardados no seu computador, mas não em outro lugar.";
  } else {
    valorNuvem = "Tudo já subiu";
    obsNuvem = escapeHtml(r.remoto || "");
  }
  el.innerHTML += vsResposta(corNuvem, "Tem ponto salvo que ainda não subiu pra nuvem?",
    valorNuvem, obsNuvem);

  // 4. onde eu estou
  el.innerHTML += vsResposta("verde", "Onde eu estou?",
    escapeHtml(r.branch || "—"),
    r.tem_remoto ? `nuvem: <code>${escapeHtml(r.remoto || "")}</code>` : "sem cópia na nuvem");

  if (r.commits && r.commits.length){
    const c = document.createElement("div");
    c.className = "vs-commits";
    c.innerHTML = `<h3>Últimos pontos salvos</h3>` + r.commits.map(x =>
      `<div class="vs-commit"><span class="quando">${escapeHtml(x.ha_quanto || "")}</span>` +
      `<span title="${escapeHtml((x.arquivos || []).join("\n"))}">${escapeHtml(x.mensagem)}</span>` +
      `<span class="n">${x.quantos_arquivos} arq.</span></div>`).join("");
    el.appendChild(c);
  }

  const acoes = document.createElement("div");
  acoes.className = "vs-acoes";
  [["salvar", "Salvar um ponto"], ["nuvem", "Mandar pra nuvem"], ["linha", "Começar uma linha nova"]]
    .forEach(([tipo, rotulo], i) => {
      const b = document.createElement("button");
      b.className = "brf-btn" + (i === 0 ? " prim" : "");
      b.textContent = rotulo + " →";
      b.onclick = () => vsPrompt(tipo, r.chave, rotulo);
      acoes.appendChild(b);
    });
  el.appendChild(acoes);

  const nota = document.createElement("p");
  nota.style.cssText = "font-size:var(--fs-1);color:var(--text-2);margin:var(--sp-2) 0 0";
  nota.textContent = "Estes botões geram o texto para você colar numa sessão de IA. A Estação nunca executa git.";
  el.appendChild(nota);
  return el;
}

async function vsPrompt(tipo, repo, rotulo){
  try {
    const d = await (await fetch(`/api/versoes/prompt?tipo=${encodeURIComponent(tipo)}&repo=${encodeURIComponent(repo)}`)).json();
    if (d.error){ toast(d.error); return; }
    mostrarPrompt(d.texto, {
      titulo: rotulo,
      sub: `Cole numa sessão de IA com a pasta <code>${escapeHtml(d.pasta)}</code> aberta. O estado real do git já vai no texto.`,
    });
  } catch(e){ toast("Falha ao gerar: " + e); }
}

// Embarque — os primeiros passos (POST /api/embarque/prompt)

// Cinco paradas. As respostas ficam no localStorage com o mesmo try/catch
// defensivo do Tour: navegador em modo privado ou dados de site bloqueados não
// podem derrubar a única tela que serve a quem ainda não tem plataforma.
const EB_KEY = "estacao.embarque.v1";
let EB_JA_ABRIU = false;
let EB_PASSO = 0;
let EB = {caminho: "", nome: "", usos: ["notas"], tem_conteudo: "vazia", destino: "claude-code"};

function ebCarregar(){
  try {
    const cru = localStorage.getItem(EB_KEY);
    if (cru) EB = Object.assign(EB, JSON.parse(cru));
  } catch(e){}
}
function ebSalvar(){
  try { localStorage.setItem(EB_KEY, JSON.stringify(EB)); } catch(e){}
}

const EB_USOS = [
  {id: "notas", rotulo: "Guardar e organizar ideias", sub: "o básico: capturar sem fricção e arrumar depois. Não dá pra desmarcar — é o motor.", fixo: true},
  {id: "decisoes", rotulo: "Registrar decisões que dependem de mim", sub: "acrescenta uma pasta de pendências: cada dúvida vira uma pergunta com opções, que espera por você."},
  {id: "projetos", rotulo: "Tocar projetos", sub: "acrescenta o quarto estágio. Sem issa plataforma de origem tem três, e funciona igual."},
  {id: "portfolio", rotulo: "Ver num só lugar tudo que já roda", sub: "cada projeto declara o que publica; o app monta o Portfólio a partir disso. Precisa de \u201cprojetos\u201d."},
];

const EB_DESTINOS = [
  {id: "claude-code", rotulo: "Claude Code"},
  {id: "codex", rotulo: "Codex"},
  {id: "outro", rotulo: "Outra ferramenta"},
];

function ebParadas(){
  return [
    {
      titulo: "1 — O que é isto",
      corpo: `<p>A <strong>Estação</strong> é este app. Ela não pensa por você e não tem IA dentro: ela organiza o que você guarda, e prepara o texto que você cola numa sessão de IA quando quiser que algo seja feito.</p>
        <p>Uma <strong>plataforma</strong> é um espaço de trabalho seu — uma pasta no seu computador, com as suas ideias. A Estação pode operar várias; você ainda não tem nenhuma.</p>
        <p>O que você leva daqui: um <strong>texto pronto para colar</strong> numa sessão de IA, que cria a primeira plataforma. A Estação não vai criar nada sozinha — ela escreve o pedido, você olha, e a sessão executa.</p>`,
      valido: () => true,
    },
    {
      titulo: "2 — Onde ela vai ficar",
      corpo: `<label class="campo" for="eb-caminho">Caminho completo da pasta (ela pode nem existir ainda)</label>
        <input type="text" id="eb-caminho" value="${escapeHtml(EB.caminho)}" placeholder="C:\\Users\\voce\\MinhasIdeias" spellcheck="false">
        <label class="campo" for="eb-nome" style="margin-top:var(--sp-3)">Como você chama isso</label>
        <input type="text" id="eb-nome" value="${escapeHtml(EB.nome)}" placeholder="Minhas ideias">
        <p style="margin-top:var(--sp-3)">Escolha uma pasta que seja <strong>sua</strong> e que você vá lembrar. Ela não precisa estar vazia — a próxima parada trata disso.</p>`,
      montar: (el) => {
        el.querySelector("#eb-caminho").oninput = (e) => { EB.caminho = e.target.value; ebSalvar(); };
        el.querySelector("#eb-nome").oninput = (e) => { EB.nome = e.target.value; ebSalvar(); };
      },
      valido: () => (EB.caminho || "").trim().length >= 3,
      erro: "Preencha o caminho da pasta para seguir.",
    },
    {
      titulo: "3 — O que você vai usar",
      corpo: `<p>Cada escolha acrescenta pastas ao pedido. Você pode mudar de ideia depois — nada aqui é definitivo.</p>` +
        EB_USOS.map(u => {
          const marcado = EB.usos.indexOf(u.id) >= 0;
          return `<label class="eb-opcao${marcado ? " sim" : ""}" data-uso="${u.id}">
            <input type="checkbox" ${marcado ? "checked" : ""} ${u.fixo ? "disabled" : ""}>
            <span><strong>${escapeHtml(u.rotulo)}</strong><small>${u.sub}</small></span></label>`;
        }).join(""),
      montar: (el) => {
        el.querySelectorAll(".eb-opcao").forEach(lab => {
          const id = lab.dataset.uso;
          const cb = lab.querySelector("input");
          cb.onchange = () => {
            if (cb.checked){ if (EB.usos.indexOf(id) < 0) EB.usos.push(id); }
            else EB.usos = EB.usos.filter(x => x !== id);
            // portfólio sem projetos não faz sentido: um depende do outro
            if (id === "projetos" && !cb.checked) EB.usos = EB.usos.filter(x => x !== "portfolio");
            if (id === "portfolio" && cb.checked && EB.usos.indexOf("projetos") < 0) EB.usos.push("projetos");
            ebSalvar(); ebDesenhar();
          };
        });
      },
      valido: () => true,
    },
    {
      titulo: "4 — Já tem coisa nessa pasta?",
      corpo: [
        {id: "vazia", rotulo: "Está vazia, ou nem existe ainda", sub: "o caso normal."},
        {id: "tem", rotulo: "Já tem trabalho começado lá dentro", sub: "o pedido vai mandar a sessão parar e te mostrar o que tem antes de criar qualquer coisa."},
      ].map(o => `<label class="eb-opcao${EB.tem_conteudo === o.id ? " sim" : ""}" data-v="${o.id}">
          <input type="radio" name="eb-conteudo" ${EB.tem_conteudo === o.id ? "checked" : ""}>
          <span><strong>${escapeHtml(o.rotulo)}</strong><small>${o.sub}</small></span></label>`).join("") +
        `<p style="margin-top:var(--sp-3)">Em qualquer um dos dois casos o pedido proíbe apagar e sobrescrever. Esta resposta só muda o tom do aviso.</p>`,
      montar: (el) => {
        el.querySelectorAll(".eb-opcao").forEach(lab => {
          lab.querySelector("input").onchange = () => { EB.tem_conteudo = lab.dataset.v; ebSalvar(); ebDesenhar(); };
        });
      },
      valido: () => true,
    },
    {
      titulo: "5 — Onde você vai colar",
      corpo: `<p>Muda só o jeito de falar do texto — o conteúdo é o mesmo.</p>` +
        EB_DESTINOS.map(d => `<label class="eb-opcao${EB.destino === d.id ? " sim" : ""}" data-v="${d.id}">
          <input type="radio" name="eb-destino" ${EB.destino === d.id ? "checked" : ""}>
          <span><strong>${escapeHtml(d.rotulo)}</strong></span></label>`).join(""),
      montar: (el) => {
        el.querySelectorAll(".eb-opcao").forEach(lab => {
          lab.querySelector("input").onchange = () => { EB.destino = lab.dataset.v; ebSalvar(); ebDesenhar(); };
        });
      },
      valido: () => true,
    },
  ];
}

async function openEmbarqueView(){
  ebCarregar();
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  document.getElementById("breadcrumb").textContent = "Estação / Embarque";
  document.getElementById("meta-bar").innerHTML =
    `<span class="badge badge-type">embarque</span><span id="meta-path">primeiros passos</span>`;
  ebDesenhar();
}

function ebDesenhar(){
  const paradas = ebParadas();
  const p = paradas[EB_PASSO];
  const content = document.getElementById("content");
  content.innerHTML = `<h1>Embarque</h1>
    <p class="dash-lead">Cinco perguntas, e você sai daqui com o texto que cria a sua primeira plataforma.</p>`;

  const dots = document.createElement("div");
  dots.className = "eb-passos";
  dots.style.maxWidth = "640px";
  paradas.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "eb-passo-dot" + (i < EB_PASSO ? " feita" : (i === EB_PASSO ? " agora" : ""));
    dots.appendChild(d);
  });
  content.appendChild(dots);

  const box = document.createElement("div");
  box.className = "eb-parada";
  box.innerHTML = `<h3>${escapeHtml(p.titulo)}</h3>` + p.corpo;
  content.appendChild(box);
  if (p.montar) p.montar(box);

  const acoes = document.createElement("div");
  acoes.className = "eb-acoes";
  if (EB_PASSO > 0){
    const voltar = document.createElement("button");
    voltar.className = "brf-btn";
    voltar.textContent = "← Voltar";
    voltar.onclick = () => { EB_PASSO--; ebDesenhar(); };
    acoes.appendChild(voltar);
  }
  const seguir = document.createElement("button");
  seguir.className = "brf-btn prim";
  seguir.textContent = EB_PASSO === paradas.length - 1 ? "Gerar o texto →" : "Avançar →";
  seguir.onclick = () => {
    if (!p.valido()){
      const e = document.createElement("p");
      e.className = "eb-erro";
      e.textContent = p.erro || "Falta responder esta parada.";
      acoes.parentNode.insertBefore(e, acoes.nextSibling);
      return;
    }
    if (EB_PASSO === paradas.length - 1) ebGerar();
    else { EB_PASSO++; ebDesenhar(); }
  };
  acoes.appendChild(seguir);
  content.appendChild(acoes);
}

async function ebGerar(){
  let data;
  try {
    const r = await fetch("/api/embarque/prompt", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(EB)});
    data = await r.json();
    if (data.error){ toast(data.error); return; }
  } catch(err){ toast("Falha ao gerar: " + err); return; }

  mostrarPrompt(data.texto, {
    titulo: "Crie a sua primeira plataforma",
    sub: `Cole numa sessão de IA <strong>com a pasta aberta</strong>. Este texto não criou nada — quem cria é a sessão, com você olhando.`,
  });

  // registra no estacao.json para que a plataforma já apareça no seletor assim
  // que a estrutura existir. Falhar aqui não pode atrapalhar: o texto, que é o
  // que importa, já está na tela.
  try {
    const r = await fetch("/api/embarque/registrar", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({caminho: data.caminho, nome: data.nome})});
    const reg = await r.json();
    if (reg.ok) await carregarPlataformas();
  } catch(e){}
}

// ============================================================
// Fluxo — o método na tela (só leitura; classificar continua sendo da skill)
// ============================================================
// Uma passagem por par de estágios consecutivos, com os critérios de
// metodo/classificar.md. Não grava veredito: daqui sai o briefing pra sessão
// de IA fazer o registro.
//
// Os conjuntos abaixo são alinhados pelo FIM da lista de estágios. Uma
// plataforma de quatro estágios usa os três; uma de três usa os dois últimos.
// Ficam hardcoded de propósito, como
// os guardrails do briefing: parsear a prosa do método para montar esta tela a
// deixaria quebrar em silêncio a cada edição de texto.
const FX_SETS = [
  {
    pergunta: "já foi lido e organizado?",
    regra: 2,
    criterios: [
      "Alguém leu isto inteiro — não é mais um \u201cvou ver depois\u201d?",
      "Tem título e alguma estrutura: parágrafos, tópicos, seções?",
      "Dá para entender do que se trata sem reler três vezes?",
      "O que era ruído (assinatura, timestamp, repetição) saiu?",
    ],
  },
  {
    pergunta: "serve de insumo para outra coisa, sem reprocessar?",
    regra: 2,
    criterios: [
      "Tem forma definida — é um documento, não um fragmento?",
      "Poderia ser usado como entrada de outro trabalho sem reprocessamento?",
      "Representa uma decisão, uma v1, ou um resumo com próximos passos?",
      "Deixou de ser ambíguo sobre o que é e para que serve?",
    ],
  },
  {
    pergunta: "tem corpo próprio?",
    regra: "todos",
    criterios: [
      "Tem pasta própria dentro da pasta de projetos?",
      "Tem CLAUDE.md dizendo o que é, para quem, e em que estado está?",
      "Tem backlog com pelo menos um item aberto de verdade?",
      "É um repositório git próprio?",
    ],
  },
];
let FX_MARCADOS = {};   // índice da passagem -> Set de critérios marcados
let FX_ABERTA = 0;      // qual passagem está com o checklist aberto

function fxPassagens(){
  const est = plEstagios();
  if (est.length < 2) return [];
  const sets = FX_SETS.slice(-(est.length - 1));
  return est.slice(0, -1).map((de, i) => ({
    de, para: est[i + 1], set: sets[i] || FX_SETS[FX_SETS.length - 1],
  }));
}

async function openFluxoView(){
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  document.getElementById("breadcrumb").textContent = plPrefixo() + "Fluxo";
  document.getElementById("meta-bar").innerHTML =
    `<span class="badge badge-type">método</span>` +
    `<span id="meta-path">${escapeHtml(plCadeia())} — nenhum item pula estágio</span>`;
  const content = document.getElementById("content");
  const passagens = fxPassagens();
  content.innerHTML = `<h1>Fluxo</h1>
    <p class="dash-lead">O caminho que toda entrada percorre nesta plataforma. Esta tela não classifica nada — ela ajuda você a decidir, e gera o briefing para a sessão de IA fazer o registro.</p>`;

  if (!passagens.length){
    content.innerHTML += `<p class="dash-lead">Esta plataforma declara menos de dois estágios: não há passagem para mostrar.</p>`;
    return;
  }

  // a entrada: todo item nasce no primeiro estágio, sem exceção
  const zero = document.createElement("div");
  zero.className = "fx-passo";
  zero.innerHTML = `<h3>Entrada — tudo vira ${escapeHtml(plNome(1))} (${escapeHtml(plSigla(1))})</h3>` +
    `<p class="ctx" style="font-size:var(--fs-1);color:var(--text-2);margin:0">Sem exceção, mesmo o que já nasce maduro: identificador pelo utilitário, linha no registro, arquivo no primeiro estágio. Pela interface, é o botão <strong>📝 Nota</strong>.</p>`;
  content.appendChild(zero);

  passagens.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "fx-passo";
    const marcados = FX_MARCADOS[i] || (FX_MARCADOS[i] = new Set());
    const total = p.set.criterios.length;
    const minimo = p.set.regra === "todos" ? total : p.set.regra;

    el.innerHTML = `<h3>${escapeHtml(plNome(i + 1))} → ${escapeHtml(plNome(i + 2))} — ${escapeHtml(p.set.pergunta)}</h3>`;

    const nota = document.createElement("p");
    nota.style.cssText = "font-size:var(--fs-1);color:var(--text-2);margin:0 0 var(--sp-1)";
    nota.textContent = p.set.regra === "todos"
      ? "Aqui a régua é mais alta: os quatro precisam valer, não a maioria."
      : `Marque os critérios que valem para o item — ${minimo} ou mais promovem:`;
    el.appendChild(nota);

    p.set.criterios.forEach((texto, idx) => {
      const lab = document.createElement("label");
      lab.className = "fx-crit" + (marcados.has(idx) ? " sim" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = marcados.has(idx);
      cb.onchange = () => { cb.checked ? marcados.add(idx) : marcados.delete(idx); FX_ABERTA = i; openFluxoView(); };
      lab.appendChild(cb);
      const sp = document.createElement("span");
      sp.textContent = texto;
      lab.appendChild(sp);
      el.appendChild(lab);
    });

    const n = marcados.size;
    const promove = n >= minimo;
    const ver = document.createElement("div");
    ver.className = "fx-veredito " + (promove ? "sbi" : "fica");
    ver.textContent = promove
      ? `${n} de ${total} → promove a ${plNome(i + 2)} (${plSigla(i + 2)})`
      : `${n} de ${total} → fica como ${plNome(i + 1)}. Se a dúvida for genuína, vire pendência em vez de forçar.`;
    el.appendChild(ver);

    if (i === 0){
      const btn = document.createElement("button");
      btn.className = "brf-btn";
      btn.style.marginTop = "var(--sp-2)";
      btn.textContent = "Briefing de classificação →";
      btn.onclick = () => {
        const pasta = (plEstagio(1) || {}).pasta || "";
        const alvo = ENTRIES.find(e => e.path === SELECTED_PATH && e.path.startsWith(pasta))
          || ENTRIES.find(e => e.path.startsWith(pasta + "/") && !e.path.includes("/" + (PLAT && PLAT.historico || "_historico") + "/") && e.path.endsWith(".md"));
        if (!alvo){ toast(`Abra ${plNome(1, true).toLowerCase()} antes`); return; }
        abrirBriefing("classificar", {path: alvo.path});
      };
      el.appendChild(btn);
    }
    content.appendChild(el);
  });

  const fim = document.createElement("div");
  fim.className = "fx-passo";
  fim.innerHTML = `<h3>Ao avançar</h3>` +
    `<p class="ctx" style="font-size:var(--fs-1);color:var(--text-2);margin:0">O item é <strong>copiado</strong> para o estágio seguinte com identificador novo, o original vai para o <code>${escapeHtml((PLAT && PLAT.historico) || "_historico")}/</code> do estágio de onde saiu, e o registro ganha uma linha nova com o marcador de linhagem. A linha antiga nunca é editada nem apagada.</p>`;
  content.appendChild(fim);
}

// ============================================================
// Nota — captura crua pela UI, no primeiro estágio (POST /api/nota/nova)
// ============================================================
// Só cria SBC crua, sem classificar (opção default enquanto a decisão de escopo
// não é respondida — ver plano-console-operacional-2026-09-06.md, frente 1).
let NOTAS_CRIADAS_SESSAO = [];

async function openNotaView(){
  SELECTED_PATH = null;
  renderTree();
  document.getElementById("content").classList.remove("pf-wide");
  document.getElementById("breadcrumb").textContent = plPrefixo() + "Nova nota";
  document.getElementById("meta-bar").innerHTML = `<span class="badge badge-type">captura</span><span id="meta-path">vira ${escapeHtml(plNome(1))} (${escapeHtml(plSigla(1))}) no primeiro estágio — sem classificação, sem IA</span>`;
  const content = document.getElementById("content");
  content.innerHTML = `
    <h1>Nova nota</h1>
    <p class="dash-lead">Cole ou escreva o que quiser guardar. Vira ${escapeHtml(plNome(1, false).toLowerCase())} com identificador, arquivo e linha no registro — organizar e promover continua sendo trabalho de uma sessão de IA depois.</p>
    <textarea id="nota-texto" rows="10" placeholder="Cole aqui o texto cru..."></textarea>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
      <button id="nota-salvar-btn">Salvar</button>
      <span id="nota-status" style="font-size:12.5px;color:var(--text-2)"></span>
    </div>
    <div id="nota-recentes" style="margin-top:24px"></div>
  `;
  document.getElementById("nota-salvar-btn").onclick = salvarNota;
  renderNotasRecentes();
  document.getElementById("nota-texto").focus();
}

async function salvarNota(){
  const ta = document.getElementById("nota-texto");
  const status = document.getElementById("nota-status");
  const texto = ta.value.trim();
  if (!texto){
    status.textContent = "Escreva algo antes de salvar.";
    status.style.color = "var(--danger)";
    return;
  }
  const btn = document.getElementById("nota-salvar-btn");
  btn.disabled = true;
  status.textContent = "Salvando…";
  status.style.color = "var(--text-2)";
  try{
    const r = await fetch("/api/nota/nova", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({texto}),
    });
    const data = await r.json();
    if (!r.ok){
      status.textContent = "Erro: " + (data.error || r.status);
      status.style.color = "var(--danger)";
      btn.disabled = false;
      return;
    }
    status.textContent = "";
    NOTAS_CRIADAS_SESSAO.unshift(data);
    ta.value = "";
    renderNotasRecentes();
    await reindex(); // pra aparecer na árvore/no Workflow sem precisar clicar em "reindexar"
    toast("Nota salva: " + data.id);
  } catch(err){
    status.textContent = "Falha de rede: " + err;
    status.style.color = "var(--danger)";
  } finally {
    btn.disabled = false;
  }
}

function renderNotasRecentes(){
  const box = document.getElementById("nota-recentes");
  if (!box) return;
  if (!NOTAS_CRIADAS_SESSAO.length){ box.innerHTML = ""; return; }
  box.innerHTML = "<h2>Criadas nesta sessão</h2>" + NOTAS_CRIADAS_SESSAO.map(n =>
    `<p><code>${escapeHtml(n.id)}</code> — <a href="#" data-open-nota="${escapeHtml(n.path)}">${escapeHtml(n.path)}</a></p>`
  ).join("");
  box.querySelectorAll("[data-open-nota]").forEach(a => {
    a.onclick = (ev) => { ev.preventDefault(); openFile(a.dataset.openNota); };
  });
}

// Resolve um href de markdown (relativo ao arquivo aberto) pro caminho real
// dentro do índice — mesma lógica de resolução de "../" que um navegador
// faria, mas contra ENTRIES em vez do disco. Corrige o bug de links com mais
// de um nível de "../" (ex.: "../../um-projetoCLAUDE.md" a partir de um
// arquivo 2 níveis fundo) resolverem errado ou não resolverem.
function resolveRelativePath(href, fromPath){
  let target = (href || "").split("#")[0].split("?")[0].replace(/`/g, "").trim();
  if (!target) return null;
  const isRelative = target.startsWith(".");
  const baseParts = (fromPath || "").split("/");
  baseParts.pop(); // remove o nome do arquivo, sobra só o diretório
  const parts = isRelative ? baseParts.concat(target.split("/")) : target.split("/");
  const stack = [];
  for (const seg of parts){
    if (seg === "" || seg === ".") continue;
    if (seg === ".."){ stack.pop(); continue; }
    try { stack.push(decodeURIComponent(seg)); } catch(e) { stack.push(seg); }
  }
  return stack.join("/");
}

function resolveEntry(hrefOrName, basePath){
  // 1) resolução estrutural (correta pra qualquer profundidade de "../")
  if (basePath){
    const resolved = resolveRelativePath(hrefOrName, basePath);
    if (resolved){
      let m = ENTRIES.find(e => e.path === resolved);
      if (m) return m;
      m = ENTRIES.find(e => e.path === resolved.replace(/\/$/, "") + "/CLAUDE.md");
      if (m) return m;
    }
  }
  // 2) heurísticas legadas — cobrem casos sem base clara, como um ID parcial
  // do LOG (YY.MM.DD-ETAPA-SEQ, sem o slug-hash final do nome real do arquivo)
  let clean = hrefOrName.replace(/^(\.\.\/)+/, "").replace(/^\.\//, "").replace(/`/g, "");
  let match = ENTRIES.find(e => e.path === clean || e.path.endsWith("/" + clean.split("/").pop()));
  if (match) return match;
  match = ENTRIES.find(e => e.path === clean.replace(/\/$/, "") + "/CLAUDE.md");
  if (match) return match;
  const base = clean.split("/").pop();
  match = ENTRIES.find(e => e.path.split("/").pop().startsWith(base));
  if (match) return match;
  match = ENTRIES.find(e => e.path.startsWith(clean.replace(/\/$/, "") + "/"));
  return match || null;
}

function tryOpenTarget(hrefOrName, basePath){
  const match = resolveEntry(hrefOrName, basePath || SELECTED_PATH);
  if (match){
    openFile(match.path);
  } else {
    toast("Não encontrado no índice: " + hrefOrName);
  }
}

// Links dentro do markdown renderizado (#content) são <a href="..."> normais
// — sem isto, o navegador tenta *navegar* pro caminho cru (ex.: clicar em
// "../_indice.md") e o servidor responde 404, porque só
// serve conteúdo via /api/file?path=..., não por path direto. Intercepta e
// roteia pela SPA, deixando passar só o que genuinamente deve navegar fora
// dela (link externo, âncora, e os data-href da view de LOG que já têm
// handler próprio).
document.getElementById("content").addEventListener("click", (ev) => {
  const a = ev.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || href.startsWith("#") || a.dataset.href) return;
  if (a.target === "_blank" || /^([a-z][a-z0-9+.-]*:)?\/\//i.test(href) || /^(mailto|tel):/i.test(href)) return;
  ev.preventDefault();
  tryOpenTarget(href, SELECTED_PATH);
});

// ============================================================
// Busca completa (Enter na search box)
// ============================================================
async function fullSearch(query){
  const r = await fetch("/api/search?q=" + encodeURIComponent(query));
  const data = await r.json();
  const content = document.getElementById("content");
  document.getElementById("breadcrumb").textContent = `Busca: "${query}"`;
  document.getElementById("meta-bar").innerHTML = "";
  content.innerHTML = "";
  if (data.results.length === 0){
    content.innerHTML = `<p style="color:var(--text-2)">Nada encontrado.</p>`;
    return;
  }
  data.results.forEach(res => {
    const div = document.createElement("div");
    div.className = "search-result";
    div.innerHTML = `
      <div class="search-result-title">${escapeHtml(res.title)} <span class="badge badge-type" style="margin-left:6px">${TYPE_LABELS[res.type]||res.type}</span></div>
      <div class="search-result-path">${escapeHtml(res.path)}</div>
      <div class="search-result-snippet">${escapeHtml(res.snippet)}</div>
    `;
    div.onclick = () => openFile(res.path);
    content.appendChild(div);
  });
}

// ============================================================
// Tema
// ============================================================
// Preferência de quem está olhando, não da plataforma: fica no localStorage,
// com o mesmo try/catch defensivo do Tour (navegador em modo privado, dados de
// site bloqueados — nada disso pode derrubar a interface).
const TEMA_KEY = "estacao.tema.v1";
function aplicarTema(tema){
  if (tema) document.documentElement.setAttribute("data-tema", tema);
  else document.documentElement.removeAttribute("data-tema");
  try { tema ? localStorage.setItem(TEMA_KEY, tema) : localStorage.removeItem(TEMA_KEY); } catch(e){}
}
(function iniciarTema(){
  let salvo = "";
  try { salvo = localStorage.getItem(TEMA_KEY) || ""; } catch(e){}
  const sel = document.getElementById("tema-seletor");
  sel.value = salvo;
  if (salvo) document.documentElement.setAttribute("data-tema", salvo);
  sel.addEventListener("change", (ev) => aplicarTema(ev.target.value));
})();

carregarPlataformas();
loadIndex();
