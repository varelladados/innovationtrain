<!doctype html>
<meta charset="utf-8">
<title>Protótipo — uma tela</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:34rem;margin:3rem auto;padding:0 1rem;
       line-height:1.5}
  h1{font-size:1.3rem}
  label{display:block;margin:.6rem 0 .2rem;font-size:.9rem;color:#555}
  ul{padding-left:1.1rem}
  .falta{color:#8C2F3A}
</style>
<h1>O que dá pra fazer hoje</h1>
<label>o que tem em casa</label>
<input value="ovo, batata, cebola, creme de leite" style="width:100%;padding:.5rem">
<h2 style="font-size:1rem;margin-top:1.5rem">Sai destes</h2>
<ul>
  <li><strong>Omelete de batata</strong> — não falta nada</li>
  <li><strong>Arroz de forno</strong> — <span class="falta">falta arroz cozido</span></li>
  <li><strong>Sopa de cebola</strong> — <span class="falta">faltam 2: caldo, pão</span></li>
</ul>
<p style="color:#777;font-size:.85rem">Protótipo estático de exemplo — a ordenação
é por quantos ingredientes faltam, não por relevância.</p>
